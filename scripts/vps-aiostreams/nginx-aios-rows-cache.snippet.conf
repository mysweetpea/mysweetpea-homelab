# Items/Latest home-row micro-cache (2026-10-15).
# Caches the marquee "Recently Added <catalog>" rows for 120s per user.
# uid+encpw live in $uri and the args are stable for this shape -> full-URL key.
# Rows carry live UserData (progress badges), hence the short TTL vs the bar
# cache's 10m. Zone + no-auth bypass map come from conf.d/aios-api-cache.conf.
proxy_cache aios_api;
proxy_cache_key "$scheme$host$uri?$args";
proxy_cache_valid 200 120s;
proxy_cache_lock on;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_cache_bypass $aios_bar_bypass;
proxy_no_cache $aios_bar_bypass;
add_header X-Aios-Cache $upstream_cache_status;
