# Server-side "LatestItemsExcludes" injection for the AIOStreams media server.
# Moonfin's home fetches one Items/Latest per visible catalog view (the 37-row boot
# wave the media bar queues behind). The client honours LatestItemsExcludes from
# /Users/Me (JellyfinUsersApi.getUserConfiguration reads data['Configuration'] from
# GET /Users/Me - NOT /Users/{id}/Configuration, which the client never sends; the first
# build aimed there and was inert). The client skips those views entirely, fetch included;
# the aios server hardcodes the list empty. Patch the response at the edge: keep the marquee
# rows (Trending/Popular/Netflix/Hulu/Crunchyroll/Disney+ movies+shows), exclude the rest.
# Libraries stay fully browsable; media bar + collections untouched.
sub_filter '"LatestItemsExcludes":[]' '"LatestItemsExcludes":["a281c33fb3bb152e71a5d1442b634258", "a2606deb6bee40c4b9566cf4edf03a96", "a2620bb6bcf84dd6f9d0c9ca6e1e5f0b", "a2f49b3a41e95a7b268481c8c788d197", "a2225615fa81775f9d7cf8e66e0edd2c", "a2e84e6d354ba17cac5260a0e789c187", "a25536a96f14d4a89b0ffbbd8b538272", "a2dc5702c277a474ae66cf2034b28fe0", "a2d4b820b719bc5471baa820964d31c2", "a26554ceba2bfeb108ac1e6c475f28c0", "a2098b4286b0c17bd5a43b155f010c95", "a263eb0b49d7f70313843cbde061e8d3", "a21d929ad91d7001527fe83d6ea68c4e", "a2f15455bd6e4d51cf6532158a030953", "a22e6d01311424f5973123b457f881c6", "a213ef06091081e256e5582f20b86a20", "a2ab68538149569b994f2d9d397b3359", "a222252b2d70ff8d94b77ed615892c41", "a2c6d06263339854c6b6ebbe7cd3ff9e", "a249d90d3bbb0cee09d986ec1af5dd49", "a2a48a8d787cfe54803e4e407a39c041", "a2dd30e92bda2c79a8fa732dd7200bab", "a27af87728b75bd23ce62d061fd7ab24", "a2cbcb608ae731e5c652e127dfc43daf", "a2ce23d8eeda5eead6ea9afc405e1763"]';
