# included from the item-images regex location on the aiostreams vhost
proxy_pass http://127.0.0.1:3000;
proxy_cache aios_images;
proxy_cache_key "$scheme$host$aios_key_uri$is_args$args";
proxy_cache_valid 200 30d;
# Only 200s may be cached. TMDB sends cache headers on its 404 pages and
# the relay forwards them; a relayed 404 otherwise enters this cache and
# is then served with cs=HIT, bypassing error_page (cache hits skip it).
proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
add_header X-Aios-Img $upstream_cache_status always;

# Artwork placeholder armor (2026-10-15): never hand clients a 4xx/5xx for item
# artwork. Moonfin builds before 2.7.0+Oct7 hold connections open on unread 404
# bodies (upstream issue 1766); four artwork 404s exhausted the client's
# 4-connection artwork pool and killed all artwork for the session. Items
# without posters (bogus w500null tags) were the trigger; intercept and serve
# a transparent tile instead.
proxy_intercept_errors on;
error_page 404 500 502 503 504 =200 /artwork-missing.png;
