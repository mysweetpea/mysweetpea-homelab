# Continue-Watching dedupe sidecar route (2026-10-16). Keeps one card per
# series in /UserItems/Resume (the most recently watched episode), so the
# merged Continue Watching + Next Up row never repeats a show. Fail-open to
# the app on :3000 when the sidecar is down (upstream aiostreams_resume in
# sites-enabled/aiostreams).
proxy_pass http://aiostreams_resume;
proxy_next_upstream error timeout http_502;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Aios-Lane "resume-dedupe" always;
