# aiostreams.mysweetpea.cc -> AIOStreams (VPS-local docker container)
# Public streaming lane for Stremio; independent of the home Jellyfin stack.
# DNS must stay GREY (DNS-only): Cloudflare BFM challenges Stremio's HTTP clients.
upstream aiostreams_pi {
    server 127.0.0.1:3001;           # pi-filter sidecar (browser H.264 filter)
    server 127.0.0.1:3000 backup;    # app direct: fail-open if sidecar is down
}

upstream aiostreams_genre {
    server 127.0.0.1:3003;           # genre-taxonomy filter sidecar
    server 127.0.0.1:3000 backup;
}

upstream moonbase_lite {
    server 127.0.0.1:3002;
    server 127.0.0.1:3000 backup;
}

server {
    server_name aiostreams.mysweetpea.cc;

    # certbot HTTP-01 challenge
    location ^~ /Moonfin/ {
        include snippets/moonbase-lite-proxy.conf;
            include snippets/moonbase-lite-cors.conf;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # static avatar for media-server user images
    location = /avatar.png {
        alias /var/www/aiostreams/avatar.png;
        add_header Cache-Control "public, max-age=86400";
    }
    location ^~ /avatars/ {
        root /var/www/aiostreams;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /logo.png {
        root /var/www/aiostreams;
        try_files /logo.png =404;
    }

    # Moonfin plugin surface for mount-addressed clients: their server address is
    # https://aiostreams.mysweetpea.cc/jellyfin/<uuid|alias>[/<encpw>], so every
    # /Moonfin/* call arrives mount-prefixed. Regex locations match before
    # `location /`, rerouting only these to the moonbase-lite shim.
    location ~ "^/jellyfin/(?:[^/]+/){0,2}Moonfin(/.*)$" {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        include snippets/moonbase-lite-cors.conf;
        proxy_pass http://moonbase_lite/Moonfin$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout;
    }

    # Browser clients (Chrome/Firefox/Safari, incl. Moonfin Web) cannot direct-play
    # HEVC; the pi-filter sidecar (127.0.0.1:3001) keeps only H.264 sources in
    # PlaybackInfo + item detail/list responses for browser UAs. Native apps pass
    # through byte-identical. Fail-open via the backup server if the sidecar is down.
    # Item images (posters/backdrops/logos/thumbs): immutable per tag= and identical
    # for every user -> cache bytes at nginx (relay upstream hit once per image shape).
    location ~ "/Items/[0-9a-fA-F]{32}/Images/" {
        include snippets/aios-images-cache.conf;
    }

    location ~* "/PlaybackInfo$" { include snippets/aiostreams-pi-proxy.conf; }
    location ~* "/Users/[^/]+/(Items|Shows)" { include snippets/aiostreams-pi-proxy.conf; }
    location ~* "/Shows/" { include snippets/aiostreams-pi-proxy.conf; }


    # Genre taxonomy cleanup (dedupe; drop Day/Week + year/language root entries)
    location ~ "^/jellyfin/(?:[^/]+/){0,2}Genres$" { include snippets/aiostreams-genre-proxy.conf; }
    location ~ "^/jellyfin/(?:[^/]+/){0,2}Items/Filters2?$" { include snippets/aiostreams-genre-proxy.conf; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 20m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen [::]:443 ssl ipv6only=on http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aiostreams.mysweetpea.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aiostreams.mysweetpea.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = aiostreams.mysweetpea.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aiostreams.mysweetpea.cc;
    return 404; # managed by Certbot


}