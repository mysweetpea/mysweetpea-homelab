# Synthetic playlist rows (Moonfin home content engine, 2026-10-16).
# Lives in /etc/nginx/sites-enabled/aiostreams (inserted before the
# /Items/.../Images/ location); served by the moonbase-lite shim which reads
# /opt/moonbase-lite/data/rows.json and forwards the caller's token to aios
# /Items?Ids= so UserData stays per-user. Braces in the regex MUST be quoted.
location ~ "^/jellyfin/(?:[^/]+/){0,2}Playlists(/|$)" {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Vary;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    include snippets/moonbase-lite-cors.conf;
    proxy_pass http://moonbase_lite$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout;
}
