    # Synthetic playlist rows (home content engine 2026-10-16): /Playlists/{id}/Items
    # served by the moonbase-lite shim; mirrors the Moonfin mount route (braces quoted).
    # Row micro-cache (2026-10-16): clients fetch every row TWICE per boot
    # (first paint + settings-apply reload) and again on each relaunch.
    # This path carries NO per-user uid (unlike rows/bar/children), so the
    # cache key includes the Authorization header -> entries are per-DEVICE,
    # never shared across members (no UserData bleed). $aios_key_uri still
    # strips the rotatable mount token. 1h TTL; warm runs skip storing.
    # Deployed inline in sites-enabled/aiostreams (this file mirrors it).
    location ~ "^/jellyfin/(?:[^/]+/){0,2}Playlists(/|$)" {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        include snippets/moonbase-lite-cors.conf;
        proxy_pass http://moonbase_lite$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;  # required for proxy_cache to store these small JSON bodies
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_cache aios_api;
        proxy_cache_key "$scheme$host$aios_key_uri$is_args$args|$http_authorization";
        proxy_cache_valid 200 3600s;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
        proxy_cache_bypass $aios_warm;
        proxy_no_cache $aios_warm;
        add_header X-Aios-Cache $upstream_cache_status;
    }
