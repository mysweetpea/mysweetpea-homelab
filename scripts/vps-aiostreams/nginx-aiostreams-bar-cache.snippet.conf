# Media-bar pool micro-cache (companion to snippets/aiostreams-pi-proxy.conf).
# Only requests whose query carries MaxPremiereDate (the bar pool shape) are cached;
# every other call in this location bypasses and is never stored. Zone + maps:
# conf.d/aios-api-cache.conf. Upstream sends conservative cache headers (see
# proxy_ignore_headers) - 10-min freshness is deliberate for this shape.
proxy_cache aios_api;
proxy_cache_key "$scheme$host$uri?$aios_args_nots";
proxy_cache_valid 200 10m;
proxy_cache_lock on;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_cache_bypass $aios_no_bar $aios_bar_bypass;
proxy_no_cache $aios_no_bar $aios_bar_bypass;
add_header X-Aios-Cache $upstream_cache_status;
