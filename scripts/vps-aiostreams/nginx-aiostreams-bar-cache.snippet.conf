# Media-bar pool micro-cache (companion to snippets/aiostreams-pi-proxy.conf).
# Cached shapes: (a) bar pool fetches ("MaxPremiereDate=") and (b) BoxSet-children
# hydration (ParentId=b..., no IncludeItemTypes; 2026-10-15). Everything else in
# this location bypasses and is never stored. Zone + maps: conf.d/aios-api-cache.conf.
# 120s TTL: children carry live UserData (progress) - same tradeoff as the row cache;
# the bar shares the location and inherits the (fresher) 120s.
proxy_cache aios_api;
proxy_cache_key "$scheme$host$uri?$aios_args_nots";
proxy_cache_valid 200 120s;
proxy_cache_lock on;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_cache_bypass $aios_no_meta $aios_bar_bypass;
proxy_no_cache $aios_no_meta $aios_bar_bypass;
add_header X-Aios-Cache $upstream_cache_status;
