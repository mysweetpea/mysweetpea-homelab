# AIOStreams media-bar micro-cache (2026-10-14): bar pool fetches ("MaxPremiereDate="
# in the QUERY string) are catalog metadata; Moonfin's bar path reads NO user state
# (MediaBarSlideItem has no userData field - verified in Moonfin-Core) and responses
# are identical across timestamps (verified). Key strips the per-request
# MaxPremiereDate; uid stays in the path, so entries remain per-user. Every other
# /Users/*/Items call bypasses and is never stored (they carry live UserData).
# Requests without an Authorization header bypass+skip the cache (they 401 upstream).
# NOTE: nginx locations match the URI only - the gate must live in maps (below),
# never in a location regex.
proxy_cache_path /var/cache/nginx/aios_api levels=1:2 keys_zone=aios_api:16m max_size=192m inactive=4h use_temp_path=off;

map $args $aios_args_nots {
    ~^(.*)MaxPremiereDate=[^&]+(.*)$  "$1$2";
    default                            "$args";
}
map $args $aios_no_bar {
    ~MaxPremiereDate  "";
    default           "1";
}
map $http_authorization $aios_bar_bypass {
    ""      "1";
    default "";
}

# BoxSet-children hydration (collections row: /Users/*/Items?ParentId=b... with no
# IncludeItemTypes): 120s micro-cache, same live-UserData tradeoff as the row cache.
# All other non-bar shapes still bypass (see $aios_no_meta below).
map "$arg_ParentId|$arg_IncludeItemTypes" $aios_is_child {
    "~^b[0-9a-fA-F]+\|$"  "1";
    default                "";
}
map "$aios_no_bar$aios_is_child" $aios_no_meta {
    ""      "";
    "11"    "";
    default "1";
}
