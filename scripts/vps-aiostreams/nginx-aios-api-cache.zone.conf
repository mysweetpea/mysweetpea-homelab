# AIOStreams media-bar micro-cache (2026-10-14): bar pool fetches ("MaxPremiereDate="
# in the QUERY string) are catalog metadata; Moonfin's bar path reads NO user state
# (MediaBarSlideItem has no userData field - verified in Moonfin-Core) and responses
# are identical across timestamps (verified). Key strips the per-request
# MaxPremiereDate; uid stays in the path, so entries remain per-user. Every other
# /Users/*/Items call bypasses and is never stored (they carry live UserData).
# Requests without an Authorization header bypass+skip the cache (they 401 upstream).
# NOTE: nginx locations match the URI only - the gate must live in maps (below),
# never in a location regex.
proxy_cache_path /var/cache/nginx/aios_api levels=1:2 keys_zone=aios_api:16m max_size=192m inactive=4h use_temp_path=off;

# 2026-10-15 v2: canonicalize the path across ALL lanes so every device, account
# and platform shares one entry set.
#  (a) mount lane /jellyfin/<uuid|alias>/<eyJ-token>/... : every device/persona
#      mints its OWN encpw for the same config; strip it (the uid inside the path
#      is what keeps entries per-user). The uuid also normalizes to the canonical
#      dashed form, so dashless/token variants converge too.
#  (b) bare lane /jellyfin/... : older builds (the owner's iOS 2.5.x) store the
#      bare server URL; same content, so they converge on the same keys.
# Result: the warmer (mount lane) fills entries the bare-lane phone reads, and
# all devices of a user share one cache. Verified cross-lane with curl.
map $uri $aios_key_uri {
    "~^/jellyfin/[^/]+/eyJ[^/]+/?(.*)$" "/jellyfin/1b3b8e30-6d93-4f69-aed3-374fb3112cdd/$1";
    "~^/jellyfin/(.*)$"               "/jellyfin/1b3b8e30-6d93-4f69-aed3-374fb3112cdd/$1";
    default                            $uri;
}

map $args $aios_args_nots {
    ~^(.*)MaxPremiereDate=[^&]+(.*)$  "$1$2";
    default                            "$args";
}
map $args $aios_no_bar {
    ~MaxPremiereDate  "";
    default           "1";
}
map $http_authorization $aios_bar_bypass {
    ""      "1";
    default "";
}

# BoxSet-children hydration (collections row: .../Items?ParentId=b... with no
# IncludeItemTypes): 3h cache, same live-UserData tradeoff as the row cache.
# Covers BOTH client shapes (Recursive=true&Fields=UserData and Fields=BasicSyncInfo).
# All other non-bar shapes still bypass (see $aios_no_meta below).
map "$arg_ParentId|$arg_IncludeItemTypes" $aios_is_child {
    "~^b[0-9a-fA-F]+\|$"  "1";
    default                "";
}
# 2026-10-16 v4: genre shapes (GenreIds= present: genre grid pages, genre-chip
# randoms, "X for You" rows) cache too - same live-UserData tradeoff as rows and
# children (3h TTL; the hourly warmer keeps real staleness <=1h). Per-item detail
# (Ids=...) and played-seed queries carry no GenreIds and keep bypassing.
map $arg_GenreIds $aios_genre {
    "~."     "1";
    default  "";
}
map "$aios_no_bar$aios_is_child$aios_genre" $aios_no_meta {
    ""      "";
    "11"    "";
    "111"   "";
    default "1";
}

# 2026-10-15 v3: warmer bypass-read so its runs RE-STORE fresh entries.
# An nginx cache HIT does NOT extend an entry's TTL - with a 3h TTL and hourly
# HITs, entries still expired 3h after the last real store (measured: stored
# 20:38, expired 23:38, client boot 23:47 = EXPIRED re-fetch storm). The warmer
# now sends X-Aios-Warm: 1 -> bypass the read (fetch upstream, still stores).
map $http_x_aios_warm $aios_warm {
    "1"       "1";
    default   "";
}
