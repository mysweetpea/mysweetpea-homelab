services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.36.0   # pinned to match the proven cluster version
    container_name: aiostreams
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # loopback only; nginx fronts it with TLS
      - "100.82.13.16:12049:2049" # NFS share for the k3s arr pods (NetBird only)
    env_file: .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tmdb-search:
    image: python:3.12-alpine
    container_name: tmdb-search
    restart: unless-stopped
    command: ["python", "/app/aiostreams-tmdb-search.py"]
    volumes:
      - ./tmdb-search.py:/app/aiostreams-tmdb-search.py:ro
      - /opt/moonbase-lite/tmdb.key:/opt/moonbase-lite/tmdb.key:ro
    ports:
      - "127.0.0.1:3010:3010"
