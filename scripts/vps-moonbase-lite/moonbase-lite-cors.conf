# CORS for the Moonfin plugin surface. Moonfin web is served from media.mysweetpea.cc
# while the plugin API lives on this vhost = cross-origin; mirror the AIOStreams app's
# headers exactly so browser clients accept the responses. Include in BOTH the root
# /Moonfin/ location and the mount-prefixed regex location.
add_header Access-Control-Allow-Origin $http_origin always;
add_header Vary Origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Emby-Authorization, X-Emby-Token, X-MediaBrowser-Token, Range" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Retry-After" always;
if ($request_method = OPTIONS) { return 204; }
