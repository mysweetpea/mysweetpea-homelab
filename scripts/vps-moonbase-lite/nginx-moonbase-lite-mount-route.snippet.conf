    # Moonfin plugin surface for mount-addressed clients: their server address is
    # https://aiostreams.mysweetpea.cc/jellyfin/<uuid|alias>[/<encpw>], so every
    # /Moonfin/* call arrives mount-prefixed. Regex locations match before
    # `location /`, rerouting only these to the moonbase-lite shim.
    # NOTE: braces in an nginx regex location MUST be quoted ("{0,2}") or nginx
    # refuses to parse the directive (unknown directive "0,2}Moonfin...").
    location ~ "^/jellyfin/(?:[^/]+/){0,2}Moonfin(/.*)$" {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        include snippets/moonbase-lite-cors.conf;
        proxy_pass http://moonbase_lite/Moonfin$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout;
    }
