controllers:
  main:
    initContainers:
      migrate:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - node ./scripts/self-host-predeploy.js
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_INDEXER_ENABLED
          value: "true"
        - name: AFFINE_INDEXER_SEARCH_ENDPOINT
          value: http://affine-indexer.dmz.svc.cluster.local:9308
        - name: DEPLOYMENT_TYPE
          value: selfhosted
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      config-writer:
        image:
          repository: alpine
          tag: latest
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          cat > /root/.affine/config/config.json <<EOF
          {
            "server": {
              "name": "MySweetPea Notes",
              "externalUrl": "https://notes.mysweetpea.cc"
            },
            "auth": {
              "allowSignup": false,
              "trustedCloudflareHeaders": true
            },
            "doc": {
              "history": {
                "interval": 60000
              }
            },
            "flags": {
              "allowGuestDemoWorkspace": false
            },
            "copilot": {
              "enabled": true,
              "byok": {
                "enabled": true,
                "allowCustomEndpoint": true,
                "allowPrivateEndpoint": false,
                "allowedProviders": ["openai"]
              }
            },
            "mailer": {
              "SMTP.host": "smtp.resend.com",
              "SMTP.port": 587,
              "SMTP.username": "$MAILER_USER",
              "SMTP.password": "$MAILER_PASSWORD",
              "SMTP.sender": "MySweetPea Notes <notes@mysweetpea.cc>",
              "SMTP.name": "notes.mysweetpea.cc"
            },
            "oauth": {
              "providers": {
                "oidc": {
                  "clientId": "$OIDC_CLIENT_ID",
                  "clientSecret": "$OIDC_CLIENT_SECRET",
                  "issuer": "https://auth.mysweetpea.cc/application/o/affine/",
                  "allowPrivateNetwork": true,
                  "args": {
                    "scope": "openid email profile offline_access",
                    "claim_id": "preferred_username",
                    "claim_email": "email",
                    "claim_name": "name"
                  }
                }
              }
            }
          }
          EOF
        env:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-secret
        - name: MAILER_USER
          valueFrom:
            secretKeyRef:
              name: affine-smtp
              key: smtp-user
        - name: MAILER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: affine-smtp
              key: smtp-password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      patch-web-index:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        command:
        - node
        - -e
        - |
          const fs = require('fs');
          const html = fs.readFileSync('/app/static/selfhost.html', 'utf8');
          const disc = fs.readFileSync('/branding/disclaimer.html', 'utf8');
          const patched = html.replace('</body>', disc + '</body>');
          fs.writeFileSync('/web-index/selfhost.html', patched);
          if (!patched.includes('mysweetpea-login-disclaimer')) {
            console.error('disclaimer splice FAILED');
            process.exit(1);
          }
          console.log('disclaimer splice OK');
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    containers:
      main:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_SERVER_HOST
          value: notes.mysweetpea.cc
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "true"
        - name: AFFINE_INDEXER_SEARCH_ENDPOINT
          value: http://affine-indexer.dmz.svc.cluster.local:9308
        - name: DEPLOYMENT_TYPE
          value: selfhosted
        - name: AFFINE_BACKEND_RUNTIME_CONFIG_PATH
          value: /root/.affine/config/config.json
        - name: AFFINE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: affine-private-key
              key: private-key
        # Authentik OIDC — consumed by the config-writer heredoc ($OIDC_CLIENT_ID/
        # $OIDC_CLIENT_SECRET) to render config.json oauth.providers.oidc
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-secret
        - name: NODE_OPTIONS
          value: "--dns-result-order=ipv4first --require /root/.affine/config/affine-ua-patch.js"
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        ports:
        - containerPort: 3010
          name: http
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 10
    pod:
      hostAliases:
      - ip: "104.21.44.229"
        hostnames:
        - auth.mysweetpea.cc
    strategy: Recreate
  indexer:
    enabled: true
    type: deployment
    containers:
      main:
        image:
          repository: manticoresearch/manticore
          tag: "10.1.0"
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9308
              initialDelaySeconds: 10
    strategy: Recreate
service:
  main:
    controller: main
    ports:
      http:
        port: 3010
  indexer:
    controller: indexer
    ports:
      http:
        port: 9308
ingress:
  main:
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
    - host: notes.mysweetpea.cc
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    advancedMounts:
      main:
        main:
        - path: /root/.affine/config
        config-writer:
        - path: /root/.affine/config
        migrate:
        - path: /root/.affine/config
  uploads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    advancedMounts:
      main:
        main:
        - path: /root/.affine/storage
  web-index:
    type: emptyDir
    advancedMounts:
      main:
        main:
        - path: /app/static/selfhost.html
          subPath: selfhost.html
          readOnly: true
        patch-web-index:
        - path: /web-index
  indexer-data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    advancedMounts:
      indexer:
        main:
        - path: /var/lib/manticore
  branding:
    type: configMap
    name: affine-branding
    globalMounts:
    - path: /branding
      readOnly: true
