controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/shik3i/koalasync
          tag: v3.3.0
        env:
          PORT: "3000"
          MIN_VERSION: "3.1.5"
          MAX_ROOMS: "100"
          MAX_PEERS_PER_ROOM: "50"
          DEBUG_LOGGING: "0"
        envFrom:
        - secretRef:
            name: koalasync-secrets
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        probes:
          # KoalaSync v3.1.5+ rate-limits /health to 10 req/min per client IP.
          # kubelet probes at 10s = 12 req/min from the same node IP -> 429 flapping.
          # 30s period = 4 req/min combined (liveness+readiness), safely under the limit.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
    type: deployment
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 3000
