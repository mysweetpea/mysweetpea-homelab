persistence:
  enabled: true
  existingClaim: vaultwarden
  size: 2Gi
  storageClass: longhorn
# MySweetPea login disclaimer — DURABLE approach (replaces pinned index.html):
# the patch-web-vault init container splices the disclaimer snippet into a copy
# of the IMAGE's own /web-vault/index.html (which always matches the running
# version's bundle hashes). The old vaultwarden-web-index ConfigMap pinned
# an entire index.html with hashed bundle filenames — it 404'd on every image
# bump (same bug class as element-web, fixed commits 156fd01/29607c4).
additionalVolumes:
- name: web-index
  emptyDir: {}
- name: disclaimer
  configMap:
    name: vaultwarden-disclaimer
- name: branding
  configMap:
    name: vaultwarden-branding
additionalVolumeMounts:
- name: web-index
  mountPath: /web-vault/index.html
  subPath: index.html
  readOnly: true
# MySweetPea branding (vaultwarden-branding CM, manual apply):
# - SCSS override → compiled to /css/vaultwarden.css (logo + teal accent)
# - email templates → header/footer (logo, title, footer link)
# - logo PNGs → /web-vault/images/ (referenced by SCSS + email template)
- name: branding
  mountPath: /data/templates/scss/user.vaultwarden.scss.hbs
  subPath: user.vaultwarden.scss.hbs
  readOnly: true
- name: branding
  mountPath: /data/templates/email/email_header.hbs
  subPath: email_header.hbs
  readOnly: true
- name: branding
  mountPath: /data/templates/email/email_footer.hbs
  subPath: email_footer.hbs
  readOnly: true
- name: branding
  mountPath: /web-vault/images/mysweetpea-logo.png
  subPath: mysweetpea-logo.png
  readOnly: true
- name: branding
  mountPath: /web-vault/images/mysweetpea-logo-email.png
  subPath: mysweetpea-logo-email.png
  readOnly: true
# Branded favicons (sweetpea flower) — replace stock Bitwarden icons
- name: branding
  mountPath: /web-vault/images/favicon-16x16.png
  subPath: favicon-16x16.png
  readOnly: true
- name: branding
  mountPath: /web-vault/images/favicon-32x32.png
  subPath: favicon-32x32.png
  readOnly: true
- name: branding
  mountPath: /web-vault/images/apple-touch-icon.png
  subPath: apple-touch-icon.png
  readOnly: true
# Branded PWA manifest + icons (index.html link rewritten to manifest.json)
- name: branding
  mountPath: /web-vault/manifest.json
  subPath: manifest.json
  readOnly: true
- name: branding
  mountPath: /web-vault/images/icons/android-chrome-192x192.png
  subPath: android-chrome-192x192.png
  readOnly: true
- name: branding
  mountPath: /web-vault/images/icons/android-chrome-512x512.png
  subPath: android-chrome-512x512.png
  readOnly: true
# Safari pinned-tab mask icon (monochrome sweetpea flower)
- name: branding
  mountPath: /web-vault/images/safari-pinned-tab.svg
  subPath: safari-pinned-tab.svg
  readOnly: true
initContainers:
- name: patch-web-vault
  image: vaultwarden/server:1.37.4
  command:
  - /bin/sh
  - -c
  - |
    sed '/<\/body>/r /disclaimer/disclaimer.html' /web-vault/index.html | sed 's/<title page-title>Vaultwarden Web<\/title>/<title page-title>MySweetPea Vault<\/title>/' | sed 's/href="css\/vaultwarden.css"/href="css\/vaultwarden.css?v=2"/' | sed 's/href="[0-9a-f]\{16,\}\.json"/href="manifest.json"/' | sed 's/href="images\/favicon-16x16.png"/href="images\/favicon-16x16.png?v=2"/; s/href="images\/favicon-32x32.png"/href="images\/favicon-32x32.png?v=2"/; s/href="images\/apple-touch-icon.png"/href="images\/apple-touch-icon.png?v=2"/' > /web-index/index.html
    grep -q mysweetpea-login-disclaimer /web-index/index.html && echo 'disclaimer splice OK' || { echo 'WARN: disclaimer splice failed'; exit 1; }
    grep -q 'MySweetPea Vault' /web-index/index.html && echo 'title OK' || { echo 'WARN: title replace failed'; exit 1; }
    grep -q 'vaultwarden.css?v=2' /web-index/index.html && echo 'css cache-bust OK' || { echo 'WARN: css cache-bust failed'; exit 1; }
    grep -q 'href="manifest.json"' /web-index/index.html && echo 'manifest link OK' || { echo 'WARN: manifest link rewrite failed'; exit 1; }
    grep -q 'favicon-32x32.png?v=2' /web-index/index.html && echo 'favicon cache-bust OK' || { echo 'WARN: favicon cache-bust failed'; exit 1; }
  volumeMounts:
  - name: web-index
    mountPath: /web-index
  - name: disclaimer
    mountPath: /disclaimer
    readOnly: true
# RWO PVC + replicas=1: maxSurge 0 avoids the RWO surge-pod Multi-Attach stall
# (brief maxUnavailable=1 gap per update instead of hours-long rollout stall).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
image:
  tag: "1.37.4"
  repository: vaultwarden/server
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
vaultwarden:
  domain: "https://vault.mysweetpea.cc"
  allowSignups: false
  # SSO-only: invitations create accounts outside Authentik
  allowInvitation: false
  # -- Enable organization event logging (audit log)
  orgEvents: true
  # -- Organization event retention in days
  orgEventsRetention: "30"
  # -- Number of days to auto-delete trashed items
  autoDeleteDays: "30"
  # -- Limit attachment disk usage per user (in KB) — 512MB (2Gi PVC)
  attachmentLimitUser: "524288"
  # -- Limit send disk usage per user (in KB) — 512MB (2Gi PVC)
  sendLimitUser: "524288"
  admin:
    enabled: true
    existingSecret: "vaultwarden-admin"
  sso:
    enabled: true
    authority: "https://auth.mysweetpea.cc/application/o/vaultwarden/"
    scopes: "email profile offline_access"
    only: true
    signupsMatchEmail: true
    allowUnknownEmailVerification: false
    clientCacheExpiration: 0
    existingSecret: "vaultwarden-sso"
  smtp:
    enabled: true
    host: "smtp.resend.com"
    from: "vault@mysweetpea.cc"
    fromName: "MySweetPea Vault"
    security: starttls
    port: "587"
    authMechanism: Plain
    existingSecret: "vaultwarden-smtp"
  push:
    enabled: true
    existingSecret: "vaultwarden-push"
