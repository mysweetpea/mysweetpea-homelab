persistence:
  enabled: true
  existingClaim: vaultwarden
  size: 2Gi
  storageClass: longhorn
# MySweetPea login disclaimer — DURABLE approach (replaces pinned index.html):
# the patch-web-vault init container splices the disclaimer snippet into a copy
# of the IMAGE's own /web-vault/index.html (which always matches the running
# version's bundle hashes). The old vaultwarden-web-index ConfigMap pinned
# an entire index.html with hashed bundle filenames — it 404'd on every image
# bump (same bug class as element-web, fixed commits 156fd01/29607c4).
additionalVolumes:
- name: web-index
  emptyDir: {}
- name: disclaimer
  configMap:
    name: vaultwarden-disclaimer
additionalVolumeMounts:
- name: web-index
  mountPath: /web-vault/index.html
  subPath: index.html
  readOnly: true
initContainers:
- name: patch-web-vault
  image: vaultwarden/server:1.37.5
  command:
  - /bin/sh
  - -c
  - |
    sed '/<\/body>/r /disclaimer/disclaimer.html' /web-vault/index.html > /web-index/index.html
    grep -q mysweetpea-login-disclaimer /web-index/index.html && echo 'disclaimer splice OK' || { echo 'WARN: disclaimer splice failed'; exit 1; }
  volumeMounts:
  - name: web-index
    mountPath: /web-index
  - name: disclaimer
    mountPath: /disclaimer
    readOnly: true
# RWO PVC + replicas=1: maxSurge 0 avoids the RWO surge-pod Multi-Attach stall
# (brief maxUnavailable=1 gap per update instead of hours-long rollout stall).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
image:
  tag: "1.37.5"
  repository: vaultwarden/server
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# The chart hardcodes the probe path to '/' (the full web-vault page) and
# merges these keys in as siblings - setting httpGet here would emit a
# duplicate YAML key, so the path stays '/'. With timeoutSeconds:1 the kubelet
# aborted the response body mid-write, producing ~400 "Connection failed:
# error writing a body to connection" lines per 45min in the logs. Longer
# timeout + 3x lower frequency clears that without changing the signal.
probes:
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
vaultwarden:
  domain: "https://vault.mysweetpea.cc"
  allowSignups: false
  # SSO-only: invitations create accounts outside Authentik
  allowInvitation: false
  # -- Enable organization event logging (audit log)
  orgEvents: true
  # -- Organization event retention in days
  orgEventsRetention: "30"
  # -- Number of days to auto-delete trashed items
  autoDeleteDays: "30"
  # -- Limit attachment disk usage per user (in KB) — 512MB (2Gi PVC)
  attachmentLimitUser: "524288"
  # -- Limit send disk usage per user (in KB) — 512MB (2Gi PVC)
  sendLimitUser: "524288"
  admin:
    enabled: true
    existingSecret: "vaultwarden-admin"
  sso:
    enabled: true
    authority: "https://auth.mysweetpea.cc/application/o/vaultwarden/"
    scopes: "email profile offline_access"
    only: true
    signupsMatchEmail: true
    allowUnknownEmailVerification: false
    # SSO authenticates once; Vaultwarden then owns the session lifecycle.
    # With false (default) every client session is bound to the OIDC access
    # token (60min) and must round-trip authentik through Cloudflare to
    # refresh - a single failed refresh logs the phone out. That is the
    # "constantly signed out" symptom. Tradeoff: revoking a user in authentik
    # no longer kills their live vault session instantly.
    authOnlyNotSession: true
    # Cache the OIDC discovery doc for 1h instead of refetching per refresh.
    clientCacheExpiration: 3600
    existingSecret: "vaultwarden-sso"
  smtp:
    enabled: true
    host: "smtp.resend.com"
    from: "vault@mysweetpea.cc"
    fromName: "MySweetPea Vault"
    security: starttls
    port: "587"
    authMechanism: Plain
    existingSecret: "vaultwarden-smtp"
  push:
    enabled: true
    existingSecret: "vaultwarden-push"
