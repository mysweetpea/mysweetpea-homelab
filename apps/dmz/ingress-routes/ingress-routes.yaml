---
# Vaultwarden — vault.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: dmz
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vault.mysweetpea.cc`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80

---
# Authentik — auth.mysweetpea.cc (with HTTPS header middleware)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: dmz
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.mysweetpea.cc`)
      kind: Rule
      middlewares:
        - name: authentik-https-headers
        - name: authentik-rate-limit
        - name: authentik-no-cache-html
      services:
        - name: authentik-server
          port: 80

---
# Element Web — chat.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: element-web
  namespace: dmz
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`chat.mysweetpea.cc`)
      kind: Rule
      services:
        - name: element-web
          port: 80
