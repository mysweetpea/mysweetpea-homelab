# Wizarr — join.mysweetpea.cc — media onboarding wizard (Jellyfin invites + guided setup)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wizarr
  namespace: dmz
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`join.mysweetpea.cc`)
      kind: Rule
      services:
        - name: wizarr
          port: 5640
