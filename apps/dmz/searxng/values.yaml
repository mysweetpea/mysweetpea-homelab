controllers:
  main:
    containers:
      main:
        image:
          repository: searxng/searxng
          tag: 2026.10.4-7a3e41d42
        env:
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: SEARXNG_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
    strategy: Recreate
configMaps:
  config:
    enabled: true
    data:
      settings.yml: |
        # MySweetPea SearXNG — curated settings (GitOps-managed)
        # 2026-08-31: curated roster replaces default-everything (fan-out to 60+
        # engines from one LAN IP = immediate CAPTCHAs + cascading suspensions,
        # which caused the "only wikipedia" / "no results" episodes).
        use_default_settings: true

        engines:
          - name: brave
            disabled: true
          - name: startpage
            disabled: true
          - name: google cse
            disabled: true
          - name: google
            disabled: false
          - name: bing
            disabled: false
          - name: duckduckgo web
            disabled: false
          - name: wikipedia
            disabled: false
          - name: mojeek
            disabled: false
        # Re-enable others ONLY one at a time, testing after each (suspensions cascade).

        general:
          instance_name: "MySweetPea Search"

        server:
          base_url: "http://192.168.20.230:8080"
          image_proxy: true

        search:
          formats:
            - html
            - json
          autocomplete: "duckduckgo"
          favicon_resolver: "duckduckgo"
          safe_search: 0
          default_lang: "auto"

        ui:
          default_locale: "en"
          theme: "simple"
          default_theme: "simple"

        outgoing:
          request_timeout: 6.0
          pool_connections: 100
          pool_maxsize: 10
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
    - path: /etc/searxng/settings.yml
      subPath: settings.yml
      readOnly: true
  data:
    existingClaim: searxng-data-lh
    globalMounts:
    - path: /var/cache/searxng
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.230
    ports:
      http:
        port: 8080
