defaultServer:
  name: mysweetpea.cc
  url: https://matrix.mysweetpea.cc
config:
  disable_custom_urls: true
  disable_guests: true
  disable_3pid_login: true
  disable_registration: true
  disable_login_language_selector: true
  permalink_prefix: https://chat.mysweetpea.cc
  # --- Element Call (MatrixRTC via LiveKit) — exclusive VoIP stack ---
  element_call:
    use_exclusively: true
  # unauthenticated users go straight into the SSO flow (single IdP, no passwords)
  sso_redirect_options:
    immediate: true
  embedded_pages:
    login_for_welcome: true
extraVolumes:
- name: disclaimer
  configMap:
    name: element-web-disclaimer
extraVolumeMounts:
- name: disclaimer
  mountPath: /app/disclaimer.js
  subPath: disclaimer.js
  readOnly: true
# Mount the chart's nginx ConfigMap default.conf (contains our sub_filter
# disclaimer injection) over the image's TEMPLATE path so envsubst processes
# it at startup (the deployment only mounts config.json from that CM by default).
- name: config-nginx
  mountPath: /etc/nginx/templates/default.conf.template
  subPath: default.conf
  readOnly: true
image:
  tag: v1.12.35
  repository: ghcr.io/element-hq/element-web
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
# --- Durable disclaimer injection ---
# sub_filter injects the disclaimer <script> into the image's own index.html,
# so the bundle hash always matches the image (no stale index.html pinning).
# NOTE: the chart renders this into element-web-nginx CM default.conf, but the
# deployment only mounts config.json from that CM — we mount default.conf over
# /etc/nginx/templates/default.conf.template (extraVolumeMounts below) so
# envsubst processes it at startup. Must include the image's extra locations
# (/config, /version, /i18n, /modules) that the chart's default.conf lacks.
nginxConfig: |-
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Content-Security-Policy "frame-ancestors 'self'";
  sub_filter '</body>' '<script src="disclaimer.js"></script></body>';
  sub_filter_once on;
  location = /version {
      add_header Cache-Control "no-cache";
  }
  location /i18n/ {
      add_header Cache-Control "no-cache";
  }
  location /config {
      root /tmp/element-web-config;
      add_header Cache-Control "no-cache";
  }
  location /modules {
      alias /modules;
  }
