global:
  image:
    repository: ghcr.io/goauthentik/server
    tag: "2026.8.5"
  envFrom:
  - secretRef:
      name: authentik-blueprint-env
authentik:
  # ⚠️ image tag for the server/worker is rendered from global.image.tag (chart
  # defaultTag = Chart.AppVersion; authentik.image.* is IGNORED by the chart —
  # confirmed from chart source _common.tpl:48 + server/deployment.yaml:72).
  # The image-updater CR writes to global.image.tag (authentik entry).
  error_reporting:
    enabled: false
  postgresql:
    host: "authentik-postgresql.dmz.svc.cluster.local"
    name: "authentik"
    user: "authentik"
    port: 5432
  # Secrets (secret_key, postgresql password) live in the sealed `authentik`
  # secret (sealed-secrets/dmz/authentik.yaml) — NOT in this file.
  existingSecret:
    secretName: authentik
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ Resources MUST be at top-level `server.resources` / `worker.resources` —
# the chart renders `.Values.server.resources` (server/deployment.yaml:123) and
# `.Values.worker.resources` (worker/deployment.yaml:130). Values nested under
# `authentik.server.*` are SILENTLY IGNORED (verified against chart 2026.8.0;
# live pods had no limits before Aug 25 2026).
server:
  replicas: 1
  # ⚠️ Gunicorn worker recycling root-caused as login-latency class (Sep 2 audit):
  # default max_requests=1000 recycles workers; the first login after a recycle
  # pays a cold flow-executor (~10-38s measured). 2026.8 (Rust server) REJECTS
  # -1 ("Value must be positive" — crash-looped, verified) → use 1e9 = never
  # recycles in practice while passing validation.
  env:
  - name: AUTHENTIK_WEB__MAX_REQUESTS
    value: "1000000000"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  metrics:
    enabled: true
# Worker: 2 replicas — blueprint apply deadlocks with 1 (apply_blueprint blocks
# all threads waiting for blueprints_find_dict result, which never gets
# processed; a second worker process breaks the deadlock).
worker:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
# Git-backed Blueprints (Session 40, Aug 12 2026)
#
# Full instance export via `manage.py export_blueprint` (2026.5.6 — the UI
# per-object `{ }` export button is absent in this version), sanitized:
#   - client_secret values -> !Env AUTHENTIK_BP_*_CLIENT_SECRET
#   - system-managed entries stripped (internal service accounts, outpost JWT
#     certs, default schedules, goauthentik.io/* mappings, migrations/* records)
#   - validated with Importer.validate() (VALIDATE_RESULT: True)
# Pipeline: apps/dmz/authentik/blueprints/{sanitize-ak-export.py, finalize-ak-export.py, build-configmap.py}
# Env values live in the `authentik-blueprint-env` Secret (DB truth, incl. outpost tokens).
#
blueprints:
  configMaps:
  - authentik-blueprints
# ─────────────────────────────────────────────────────────────────────────────

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-postgresql
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi
    # ⚠️ JIT MUST STAY OFF (root-caused Sep 2 2026): Postgres JIT compiled the
    # flow-planner's 7.3KB 9-source-join query on EVERY login (~9s JIT vs 0.3ms
    # execution — pathological 1.8e13 row estimate). This caused every reported
    # authentik login hang. ALTER SYSTEM already set it live (postgresql.auto.conf
    # on the PVC); mirrored here so the chart re-applies it if the PVC is recreated.
    extendedConfiguration: |
      jit = off
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
# NOTE: redis block is DEAD CONFIG — the 2026.8 chart has no redis subchart
# (authentik now uses Postgres-backed cache + channel layers, verified in
# Django settings: django_postgres_cache + django_channels_postgres).
# Kept commented for reference; removing entirely on next export cycle.
# redis:
#   enabled: true
#   architecture: standalone
#   auth:
#     enabled: false
