      - attrs:
          execution_logging: false
          expression: "# This policy ensures that the setup flow can only be\n# executed\
            \ when the admin user doesn't have a password set\nakadmin = ak_user_by(username=\"\
            akadmin\")\n# Ensure flow was started correctly\nstarted_by = context.get(\"\
            goauthentik.io/core/setup/started-by\")\nif started_by != \"setup\":\n    setup_url\
            \ = request.http_request.build_absolute_uri(\"/\")\n    ak_message(f\"Access\
            \ the authentik setup by navigating to {setup_url}\")\n    return False\nreturn\
            \ akadmin is None or not akadmin.has_usable_password()"
          name: default-oobe-password-usable
