controllers:
  main:
    containers:
      main:
        env:
          DB_POSTGRESDB_DATABASE: n8n
          DB_POSTGRESDB_HOST: postgresql.private.svc.cluster.local
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_USER: postgres
          DB_TYPE: postgresdb
          N8N_SECURE_COOKIE: "true"
          N8N_HOST: "n8n.mysweetpea.cc"
          N8N_WEBHOOK_URL: "https://subscribe.mysweetpea.cc"
          # Kill outbound telemetry + template fetches (api.n8n.io) — log noise on
          # transient DNS blips (EAI_AGAIN), and nothing user-facing depends on them
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_TEMPLATES_ENABLED: "false"
          EXECUTIONS_DATA_PRUNE: "true"
          EXECUTIONS_DATA_MAX_AGE: "168"
          EXECUTIONS_DATA_HARD_PRUNE: "true"
        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 1000m
        envFrom:
        - secretRef:
            name: n8n-db-creds
        image:
          repository: n8nio/n8n
          tag: "2.43.3"
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /healthz
                port: 5678
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
    strategy: Recreate
persistence:
  data:
    accessMode: ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClass: longhorn
service:
  main:
    controller: main
    ports:
      http:
        port: 5678
