apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: jellyfin-config-lh
  namespace: private
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  # pinned: this PVC is the longhorn volume that already holds the data
  volumeName: pvc-468d71ef-a4fd-4aa0-ab3a-017e4f110dbc
  resources:
    requests:
      storage: 40Gi
