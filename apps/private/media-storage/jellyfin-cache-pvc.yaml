apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: jellyfin-cache-lh
  namespace: private
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  # pinned: this PVC is the longhorn volume that already holds the data
