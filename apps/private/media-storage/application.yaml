apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-storage
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: private
  sources:
  - repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    path: apps/private/media-storage
    directory:
      # Without this the app renders ITSELF (its own application.yaml lives in the path it
      # watches) and can never go Healthy -> root-homelab blocks forever on
      # "waiting for healthy state of Application/media-storage" and no app-of-apps change lands.
      exclude: application.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
