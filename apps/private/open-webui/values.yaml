controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: "v0.12.0"
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        env:
          # Legacy dead pointer (ollama deleted in Sep 28 decluster) — kept only
          # so WebUI's startup doesn't warn; no model ever served from here.
          OLLAMA_BASE_URL: http://localhost:1
          WEBUI_PORT: "8080"
          # Branding: replaces "Open WebUI" in the page title, splash, and metadata
          WEBUI_NAME: "MySweetPea AI"
          # SSO-only: disable local account creation (Authentik is the only identity source)
          ENABLE_SIGNUP: "false"
          # ── Z.AI GLM via OpenAI-compatible API (coding-plan endpoint) ──
          # paas/v4 = PAYG (empty balance); plan quota lives on the coding
          # endpoint. Verified live Oct 2 2026: models list + chat both 200.
          OPENAI_API_BASE_URL: https://api.z.ai/api/coding/paas/v4
          # ── Web search: SearXNG (dmz LB, JSON format enabled) ──
          ENABLE_WEB_SEARCH: "true"
          WEB_SEARCH_ENGINE: searxng
          SEARXNG_QUERY_URL: http://searxng.dmz.svc.cluster.local:8080/search?q=<query>
          # ── Document extraction: Docling (private LB, /v1/convert verified) ──
          CONTENT_EXTRACTION_ENGINE: docling
          DOCLING_SERVER_URL: http://docling.private.svc.cluster.local:5001
          # ── Web page loader: self-hosted Firecrawl (firecrawl ns LB) ──
          WEB_LOADER_ENGINE: firecrawl
          FIRECRAWL_API_BASE_URL: http://firecrawl-api.firecrawl.svc.cluster.local:3002
          # ── Open Terminal as native tool server ──
          # TOOL_SERVER_CONNECTIONS (full JSON incl. Bearer key) is provided by
          # the open-webui-integrations secret via envFrom — keeps the key out
          # of git. Connection verified live Oct 2: Bearer auth, /openapi.json 200.
        envFrom:
        - secretRef:
            name: open-webui-oidc
        - secretRef:
            name: open-webui-integrations
        # ── envFrom injected key fills TOOL_SERVER_CONNECTIONS bearer slot ──
        # ⚠️ Probes REMOVED (Session 39): v0.11.0 bug — probe traffic deadlocks the
        # event loop ~60s after startup (liveness fails → kubelet SIGKILLs, exit 137).
        # Verified with 6 test pods: no probes = stable 4min+; probes = death at ~110s.
        # Monitored externally by Uptime Kuma (monitor #9).
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8080
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
    - path: /app/backend/data
  web-index:
    type: configMap
    name: open-webui-web-index
    globalMounts:
    - path: /app/build/index.html
      subPath: index.html
      readOnly: true
