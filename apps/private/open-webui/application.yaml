apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd-image-updater.argoproj.io/image-list: openwebui=ghcr.io/open-webui/open-webui
    argocd-image-updater.argoproj.io/openwebui.update-strategy: semver
    argocd-image-updater.argoproj.io/openwebui.allow-tags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
    argocd-image-updater.argoproj.io/openwebui.helm.image-spec: controllers.main.containers.main.image
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git.repository: git@github.com:mysweetpea/mysweetpea-homelab.git
    argocd-image-updater.argoproj.io/git.branch: main
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:apps/private/open-webui/values.yaml
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: private
  sources:
  - repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 3.7.3
    helm:
      valueFiles:
      - $values/apps/private/open-webui/values.yaml
  - repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
