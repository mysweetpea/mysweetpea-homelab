# ──────────────────────────────────────────────
# Open Terminal — AI terminal server for Open WebUI
# Open WebUI connects via terminal_server.connections
# API key from sealed secret open-terminal-secret (key API_KEY)
# ──────────────────────────────────────────────
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-terminal
          tag: 0.14.7
          pullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: open-terminal-secret
        env:
          # cap runaway agent commands (unset = runs forever)
          OPEN_TERMINAL_EXECUTE_TIMEOUT: "300"
          # only Open WebUI may call the API
          CORS_ALLOWED_ORIGINS: "https://chat.mysweetpea.cc"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        probes:
          readiness:
            custom: true
            type: TCP
            spec:
              tcpSocket:
                port: 8000
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
    - path: /home/user
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.236
    ports:
      http:
        port: 8000
        targetPort: 8000
