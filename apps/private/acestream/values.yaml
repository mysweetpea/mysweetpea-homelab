# acestream: P2P live-stream engine (Ace Stream) + acexy multiplexing proxy.
# Try-out 2026-10-14 for the Jellyfin Live TV/Sports role: Jellyfin (or its
# AceStream plugin / an M3U tuner) talks to acexy on :8080; acexy fans out
# (per-client PID + multiplexing) to the engine on 127.0.0.1:6878 (same pod).
# LAN-only: no public ingress route; JF reach is covered by netpol
# allow-jellyfin-acestream-ingress. The engine needs arbitrary-port P2P egress
# to internet peers -> netpol allow-acestream-egress (RFC1918 excluded).
controllers:
  acestream:
    containers:
      # VPN killswitch (gluetun): provides the tun device + iptables in the pod
      # netns so ALL pod egress exits via Privado -> the Ace swarm sees the VPN
      # IP, not the home IP. Inbound (LB/JF -> acexy) is unaffected.
      gluetun:
        image:
          repository: qmcgaw/gluetun
          # Pinned by digest 2026-11-24: upstream publishes no stable semver tag,
          # and `latest` silently re-pulls a new build on every pod start.
          # (app-template 3.7.3 has no `digest:` field, hence tag@sha256.)
          tag: latest@sha256:08f6770a4b157787690dcd2d4ddb3560ec28860102530b5cdc4f632f24bfae9e
        env:
        - name: VPN_SERVICE_PROVIDER
          value: privado
        - name: TZ
          value: America/New_York
        # Only cluster + LAN subnets bypass the tunnel (kube-dns, probes);
        # everything else must exit via the VPN.
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
        envFrom:
        - secretRef:
            name: acestream-vpn
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      engine:
        image:
          repository: wafy80/acestream
          # Pinned by digest 2026-11-24 (upstream ships a rolling `latest` only)
          tag: latest@sha256:b46cfabb581b27a235106539dfeb06501745486c4bfdc5b012220c06ce72d1f9
        args: ["--client-console", "--bind-all"]
        env:
        - name: TZ
          value: America/New_York
        ports:
        - name: engine
          containerPort: 6878
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 1Gi
      acexy:
        image:
          repository: ghcr.io/javinator9889/acexy
          tag: latest@sha256:1be95013319d2a37f309c4e4fdcfff008149436d839225374ae5029a2030368b
        env:
        - name: ACEXY_HOST
          value: 127.0.0.1
        - name: ACEXY_PORT
          value: "6878"
        - name: ACEXY_LISTEN_ADDR
          value: ":8080"
        # Default is 10s; a cold P2P start here regularly needs 15-20s before
        # the engine returns headers (measured: acexy "timeout awaiting
        # response headers" then success on retry). 30s covers the warmup.
        - name: ACEXY_NO_RESPONSE_TIMEOUT
          value: 30s
        - name: TZ
          value: America/New_York
        ports:
        - name: proxy
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
service:
  main:
    controller: acestream
    # ClusterIP only: nothing outside the cluster consumes Ace directly (the
    # homepage tile has no href, Jellyfin streams via in-cluster DNS). The old
    # LoadBalancer published the engine's unauthenticated web UI on the LAN.
    type: ClusterIP
    ports:
      engine:
        port: 6878
        targetPort: 6878
      proxy:
        port: 8080
        targetPort: 8080
# /dev/net/tun for the gluetun tunnel (only mounted into that container).
persistence:
  tun:
    type: hostPath
    hostPath: /dev/net/tun
    advancedMounts:
      acestream:
        gluetun:
        - path: /dev/net/tun
