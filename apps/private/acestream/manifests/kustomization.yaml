apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: private
resources:
  - rbac.yaml
  - sealed-sync-secrets.yaml
  - cronjob.yaml
configMapGenerator:
  - name: acestream-sync-src
    files:
      - playlist-sync.py
    options:
      labels:
        app.kubernetes.io/name: acestream
        app.kubernetes.io/component: livetv
generatorOptions:
  disableNameSuffixHash: true
