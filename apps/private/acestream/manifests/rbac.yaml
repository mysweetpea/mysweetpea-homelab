apiVersion: v1
kind: ServiceAccount
metadata:
  name: acestream-sync
  namespace: private
  labels:
    app.kubernetes.io/name: acestream
    app.kubernetes.io/component: livetv
---
# The sync job owns exactly one ConfigMap: the live playlist + guide it renders.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acestream-sync
  namespace: private
  labels:
    app.kubernetes.io/name: acestream
    app.kubernetes.io/component: livetv
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acestream-sync
  namespace: private
  labels:
    app.kubernetes.io/name: acestream
    app.kubernetes.io/component: livetv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acestream-sync
subjects:
  - kind: ServiceAccount
    name: acestream-sync
    namespace: private
