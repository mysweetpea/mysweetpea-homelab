# jf-scan-gate: coalesces arr /Library/Refresh webhooks into at most ~1 scan/hour.
# Why (measured 2026-10-12): bulk import waves (repair re-grabs, megashow seasons) fired one
# full library scan PER IMPORT - 93 scan requests in 90 min, overlapping/cancelling scans and
# near-continuous library locks -> every Moonfin browse call queued (p50 9-11s vs 0.9s baseline).
# Why 60 min, not 10 (measured 2026-10-13): scans take 9-51 min (dead-strm probes), so the
# 10-min window meant EVERY trigger cancelled the in-flight scan and started over - 63 scans
# + 63 cancels in 12h, zero idle gaps, /health timing out (Kuma flapping all day) and one
# 6Gi OOMKill at 11:07Z. 60 min lets scans actually complete; imports appear within <=1h.
# Extras are swallowed with a 200 so the arr webhook sees success and keeps its retry quiet.
configMaps:
  conf:
    enabled: true
    data:
      nginx.conf: |
        events { worker_connections 64; }
        http {
          # Coalesce: first POST in each 60-min window is forwarded and its 204 cached;
          # every following POST is served from cache (HIT) without touching Jellyfin.
          proxy_cache_path /tmp/scanrefresh levels=1:2 keys_zone=scanrefresh:1m max_size=1m inactive=1h use_temp_path=off;
          server {
            listen 8096;
            # HELD 2026-10-13 ~12:58Z: all scan triggers answered 204 locally, no scan starts.
            # Reason: strm-repair backlog left ~1k missing-file items; JF's reconcile removes
            # them at 5-11s/item (vs 0.1s historically) while holding the library lock ->
            # server wedges (/health, Kuma down) for the whole run. No scans until removals
            # are fast again. RESTORE: git-history proxy_cache block (1h window, validated
            # MISS->HIT->HIT) when reconcile is done: python deploy or manual re-enable.
            location = /Library/Refresh { return 204; }
            location = /health { return 200 "ok\n"; }
            location / { return 404; }
          }
        }
controllers:
  main:
    containers:
      main:
        image:
          repository: nginx
          tag: 1.27-alpine
        ports:
          - name: http
            containerPort: 8096
            protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 2
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 3
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8096
        targetPort: 8096
persistence:
  conf:
    type: configMap
    identifier: conf
    globalMounts:
      - path: /etc/nginx/nginx.conf
        subPath: nginx.conf
        readOnly: true
