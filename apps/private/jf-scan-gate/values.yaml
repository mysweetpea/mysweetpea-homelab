# jf-scan-gate: coalesces arr /Library/Refresh webhooks into at most ~6 scans/hour.
# Why (measured 2026-10-12): bulk import waves (repair re-grabs, megashow seasons) fired one
# full library scan PER IMPORT - 93 scan requests in 90 min, overlapping/cancelling scans and
# near-continuous library locks -> every Moonfin browse call queued (p50 9-11s vs 0.9s baseline).
# Extras are swallowed with a 200 so the arr webhook sees success and keeps its retry quiet.
configMaps:
  conf:
    enabled: true
    data:
      nginx.conf: |
        events { worker_connections 64; }
        http {
          # Coalesce: first POST in each 10-min window is forwarded and its 204 cached;
          # every following POST is served from cache (HIT) without touching Jellyfin.
          proxy_cache_path /tmp/scanrefresh levels=1:2 keys_zone=scanrefresh:1m max_size=1m inactive=1h use_temp_path=off;
          server {
            listen 8096;
            location = /Library/Refresh {
              proxy_cache scanrefresh;
              proxy_cache_methods POST;
              proxy_cache_key "$uri";
              proxy_cache_valid 200 204 10m;
              proxy_cache_lock on;
              proxy_cache_lock_timeout 30s;
              proxy_ignore_headers Cache-Control Expires Set-Cookie;
              add_header X-Scan-Gate $upstream_cache_status always;
              proxy_pass http://jellyfin.private.svc.cluster.local:8096/Library/Refresh;
            }
            location = /health { return 200 "ok\n"; }
            location / { return 404; }
          }
        }
controllers:
  main:
    containers:
      main:
        image:
          repository: nginx
          tag: 1.27-alpine
        ports:
          - name: http
            containerPort: 8096
            protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 2
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 3
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8096
        targetPort: 8096
persistence:
  conf:
    type: configMap
    identifier: conf
    globalMounts:
      - path: /etc/nginx/nginx.conf
        subPath: nginx.conf
        readOnly: true
