image:
  tag: 35.0.1
  repository: library/nextcloud
resources:
  # Modest requests — cluster is CPU-committed (~85-98% across nodes)
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
nextcloud:
  host: cloud.mysweetpea.cc
  username: admin
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-creds
    usernameKey: username
    passwordKey: password
  trustedDomains:
  - cloud.mysweetpea.cc
  - 192.168.20.215
  - nextcloud.private.svc.cluster.local
  # ── Self-healing Authentik OIDC (user_oidc) ──
  # The provider config lives in the app DB; the before-starting hook
  # re-upserts it on every pod start so a DB wipe/redeploy can't lose SSO.
  # Client secret comes from the sealed secret nextcloud-oidc (mounted file).
  hooks:
    pre-installation:
    post-installation:
    pre-upgrade:
    post-upgrade:
    before-starting: |
      #!/bin/sh
      # Self-healing Authentik OIDC provider config (idempotent, runs on every pod start)
      set -eu
      # mysweetpea: entrypoint may skip occ upgrade if installed_version looks current after an
      # interrupted migration; force it (idempotent, no-op when not needed).
      php /var/www/html/occ upgrade || true
      echo "==> mysweetpea: ensuring user_oidc provider config"
      # NC35+ first boot: store apps update during `occ upgrade`, which runs AFTER this hook.
      # If the app is not yet registered (no commands), skip non-fatal — provider config
      # persists in the DB from the previous version and the next start re-applies it.
      php /var/www/html/occ app:update user_oidc >/dev/null 2>&1 || true
      if php /var/www/html/occ list user_oidc >/dev/null 2>&1; then
        php /var/www/html/occ app:enable user_oidc
      else
        echo "==> user_oidc not yet registered (pending occ upgrade) — skipping provider reconfig"
        exit 0
      fi
      php /var/www/html/occ user_oidc:provider authentik \
        --clientid="FmxfSIcs2A5dPUQxfeaYhFfbdwytpjFMS1YHtWGh" \
        --clientsecret-file="/run/secrets/nextcloud-oidc/client-secret" \
        --discoveryuri="https://auth.mysweetpea.cc/application/o/nextcloud/.well-known/openid-configuration" \
        --endsessionendpointuri="https://auth.mysweetpea.cc/application/o/nextcloud/end-session/" \
        --scope="openid email profile" \
        --unique-uid=1 \
        --mapping-display-name=name \
        --mapping-email=email \
        --mapping-uid=sub
      # Ensure the SSO user (created on first Authentik login) is in the admin group
      SSO_UID=$(php /var/www/html/occ user:list --output=json | php -r '$d=json_decode(stream_get_contents(STDIN), true); foreach ($d as $uid => $name) { if ($name === "authentik Default Admin") { echo $uid; break; } }')
      if [ -n "$SSO_UID" ]; then
        php /var/www/html/occ group:adduser admin "$SSO_UID" || true
      fi
      echo "==> mysweetpea: OIDC provider config OK"
      # Long-lived sessions: 14d PHP session, 30d remember-me cookie (idempotent)
      php /var/www/html/occ config:system:set session_lifetime --value=1209600 >/dev/null
      php /var/www/html/occ config:system:set remember_login_cookie_lifetime --value=7776000 >/dev/null
      echo "==> mysweetpea: session lifetimes OK"
  extraVolumes:
  - name: nextcloud-oidc
    secret:
      secretName: nextcloud-oidc
  extraVolumeMounts:
  - name: nextcloud-oidc
    mountPath: /run/secrets/nextcloud-oidc
    readOnly: true
  # ── notify_push (real-time file sync + notifications) ──
  # App installed via occ (custom_apps/notify_push ships the binary). Sidecar
  # runs the websocket binary; config.php points clients at /push/.
  # Setup check "Client Push" clears only when this is running.
  extraSidecarContainers:
  - name: notify-push
    image: library/nextcloud:34.0.3
    command: ["/bin/sh", "-c", "exec /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php"]
    workingDir: /var/www/html
    env:
    - name: REDIS_HOST
      value: nextcloud-redis-master
    - name: REDIS_HOST_PORT
      value: "6379"
    - name: REDIS_HOST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-redis
          key: redis-password
    volumeMounts:
    - name: nextcloud-main
      mountPath: /var/www/html
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
persistence:
  enabled: true
  existingClaim: nextcloud-nextcloud-lh
# ── Redis (notify_push queue + file-locking cache + session cache) ──
# notify_push (real-time sync) hard-requires a Redis queue; without it occ
# throws RedisException "Connection refused" on every run. Cache/queue data
# is ephemeral (clients reconnect, locks rebuild) → persistence OFF, no PVC,
# not in the backup set. Password: sealed secret nextcloud-redis.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: false
cronjob:
  # Background jobs (preview gen, Deck/Collectives/Notes indexing, activity)
  # were running in AJAX mode (unreliable). Sidecar runs real cron every 5 min.
  enabled: true
  type: sidecar
  sidecar:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # Memories indexing launches perl exiftool (~0.8s CPU). At 250m the
        # CFS stretch blows the app's hardcoded 3s exec timeout → cron logged
        # "Indexing exception: Timeout" every run since the Sep 26 reboot.
        # 1 core = exiftool boots in <1s. Verified by audit Oct 2 2026.
        cpu: 1
        memory: 512Mi
postgresql:
  enabled: false
internalDatabase:
  # ⚠️ CRITICAL (Aug 24 2026): chart defaults internalDatabase.enabled=true which
  # renders SQLITE_DATABASE and IGNORES externalDatabase — Nextcloud ran on SQLite
  # for 19 days because this was missing. Must stay false for Postgres.
  enabled: false
service:
  port: 8080
  type: ClusterIP
# notify_push port needs its own Service (the chart's service only exposes
# 8080): Traefik's /push route targets nextcloud-push:7867.
extraManifests:
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: nextcloud-push
    namespace: private
  spec:
    type: ClusterIP
    ports:
      - name: push
        port: 7867
        targetPort: 7867
    selector:
      app.kubernetes.io/name: nextcloud
externalDatabase:
  enabled: true
  type: postgresql
  host: postgresql.private.svc.cluster.local
  database: nextcloud
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-creds
    usernameKey: username
    passwordKey: password
mariadb:
  enabled: false
livenessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
