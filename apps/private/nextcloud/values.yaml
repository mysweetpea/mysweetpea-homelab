image:
  tag: 35.0.2
  repository: library/nextcloud
resources:
  # Modest requests — cluster is CPU-committed (~85-98% across nodes)
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
nextcloud:
  host: cloud.mysweetpea.cc
  # ── Performance / previews ──
  # Measured Nov 10: Files page = 250 requests; previews cost ~0.3-0.5 s cold.
  # opcache had only 14 MB of 128 MB free with 74 apps (3.2k scripts) — headroom
  # so app updates can't evict/restart the cache.
  phpConfigs:
    # zz- prefix: conf.d is read alphabetically and the image's
    # opcache-recommended.ini (sets 128 MB / 10000 files) must load first.
    zz-mysweetpea-perf.ini: |
      opcache.memory_consumption=256
      opcache.max_accelerated_files=32531
      opcache.interned_strings_buffer=64
  configs:
    # Stock providers have no HEIC — every iPhone photo showed a generic icon
    # and clients fell back to "download to view". Stock also includes
    # OpenDocument, which can never work here (no LibreOffice in the image) and
    # only wastes a request per office file. Preview size left at the 4096 px
    # default so full-screen photos stay sharp on a 4K display.
    previews.config.php: |
      <?php
      $CONFIG = array (
        'enable_previews' => true,
        'enabledPreviewProviders' => array (
          'OC\Preview\PNG',
          'OC\Preview\JPEG',
          'OC\Preview\GIF',
          'OC\Preview\BMP',
          'OC\Preview\XBitmap',
          'OC\Preview\Krita',
          'OC\Preview\WebP',
          'OC\Preview\HEIC',
          'OC\Preview\TIFF',
          'OC\Preview\MarkDown',
          'OC\Preview\TXT',
        ),
      );
  username: admin
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-creds
    usernameKey: username
    passwordKey: password
  trustedDomains:
  - cloud.mysweetpea.cc
  - 192.168.20.215
  - nextcloud.private.svc.cluster.local
  # ── Self-healing Authentik OIDC (user_oidc) ──
  # The provider config lives in the app DB; the before-starting hook
  # re-upserts it on every pod start so a DB wipe/redeploy can't lose SSO.
  # Client secret comes from the sealed secret nextcloud-oidc (mounted file).
  hooks:
    pre-installation:
    post-installation:
    pre-upgrade:
    post-upgrade:
    before-starting: |
      #!/bin/sh
      # Self-healing Authentik OIDC provider config (idempotent, runs on every pod start)
      set -eu
      # New members get the viewer folder even before Gardener's first reconcile.
      # The folder and its README are seeded as real files, not just DB records.
      skeleton="$(php /var/www/html/occ config:system:get skeletondirectory)"
      mkdir -p "$skeleton/Immich Media"
      cat > "$skeleton/Immich Media/README.txt" <<'README'
      Immich is a viewer for this Nextcloud folder.

      Add, move, or delete your photos and videos in Nextcloud, not in Immich.
      Uploads are disabled in Immich. Your originals stay in this folder.
      Deleting an item in Immich only hides it there; it does not delete the Nextcloud file.
      Albums, favorites, and people are Immich-only.
      README
      # mysweetpea: entrypoint may skip occ upgrade if installed_version looks current after an
      # interrupted migration; force it (idempotent, no-op when not needed).
      php /var/www/html/occ upgrade || true
      echo "==> mysweetpea: ensuring user_oidc provider config"
      # NC35+ first boot: store apps update during `occ upgrade`, which runs AFTER this hook.
      # If the app is not yet registered (no commands), skip non-fatal — provider config
      # persists in the DB from the previous version and the next start re-applies it.
      php /var/www/html/occ app:update user_oidc >/dev/null 2>&1 || true
      if php /var/www/html/occ list user_oidc >/dev/null 2>&1; then
        php /var/www/html/occ app:enable user_oidc
      else
        echo "==> user_oidc not yet registered (pending occ upgrade) — skipping provider reconfig"
      fi
      if php /var/www/html/occ list user_oidc >/dev/null 2>&1; then
      php /var/www/html/occ user_oidc:provider authentik \
        --clientid="FmxfSIcs2A5dPUQxfeaYhFfbdwytpjFMS1YHtWGh" \
        --clientsecret-file="/run/secrets/nextcloud-oidc/client-secret" \
        --discoveryuri="https://auth.mysweetpea.cc/application/o/nextcloud/.well-known/openid-configuration" \
        --endsessionendpointuri="https://auth.mysweetpea.cc/application/o/nextcloud/end-session/" \
        --scope="openid email profile groups offline_access" \
        --unique-uid=1 \
        --mapping-display-name=name \
        --mapping-email=email \
        --mapping-uid=sub \
        --mapping-groups=groups \
        --group-provisioning=1 \
        --group-whitelist-regex="^(sweetpea|seedling|iqbal-family|[0-9a-f]{64})$"
      # Stable Nextcloud UID mapped from the owner's Authentik `sub`; a display
      # name is user-editable and must never grant administrator privileges.
      OWNER_NC_UID="b3e2c6bba0ff9f575cdda56c7eeb8426fbf1f27aab57181f820f01248ab2fef2"
      if php /var/www/html/occ user:info "$OWNER_NC_UID" >/dev/null 2>&1; then
        php /var/www/html/occ group:adduser admin "$OWNER_NC_UID"
      fi
      echo "==> mysweetpea: OIDC provider config OK"
      fi
      # Long-lived sessions: 14d PHP session, 30d remember-me cookie (idempotent)
      php /var/www/html/occ config:system:set session_lifetime --value=1209600 >/dev/null
      php /var/www/html/occ config:system:set remember_login_cookie_lifetime --value=7776000 >/dev/null
      # Needed for OIDC session revalidation and prompt revocation handling.
      php /var/www/html/occ config:system:set store_login_token --value=1 --type=integer >/dev/null
      # Memories 10.x reads this as a SYSTEM boolean, not an app-config value.
      # The image has /usr/bin/perl; this avoids the unused bundled eperl wrapper.
      php /var/www/html/occ config:system:set memories.exiftool_no_local --value=true --type=boolean >/dev/null
      echo "==> mysweetpea: session lifetimes OK"
  extraVolumes:
  - name: nextcloud-oidc
    secret:
      secretName: nextcloud-oidc
  extraVolumeMounts:
  - name: nextcloud-oidc
    mountPath: /run/secrets/nextcloud-oidc
    readOnly: true
  # ── notify_push (real-time file sync + notifications) ──
  # App installed via occ (custom_apps/notify_push ships the binary). Sidecar
  # runs the websocket binary; config.php points clients at /push/.
  # Setup check "Client Push" clears only when this is running.
  extraSidecarContainers:
  - name: notify-push
    image: library/nextcloud:35.0.2
    command: ["/bin/sh", "-c", "exec /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push /var/www/html/config/config.php"]
    workingDir: /var/www/html
    env:
    - name: NEXTCLOUD_URL
      value: http://nextcloud:8080
    - name: REDIS_HOST
      value: nextcloud-redis-master
    - name: REDIS_HOST_PORT
      value: "6379"
    - name: REDIS_HOST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-redis
          key: redis-password
    volumeMounts:
    # Only the two paths the binary needs. Mounting the whole volume here let a
    # sidecar with a different image tag overwrite lib/ and apps/ (Nov 2026).
    - name: nextcloud-main
      mountPath: /var/www/html/custom_apps
      subPath: custom_apps
    - name: nextcloud-main
      mountPath: /var/www/html/config
      subPath: config
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  # 50k+ files on the data volume: kubelet's default recursive ownership pass
  # ran on EVERY pod start (~15 min, Nextcloud unready the whole time).
  # OnRootMismatch skips the walk when the volume root is already fsGroup 33.
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
persistence:
  enabled: true
  existingClaim: nextcloud-nextcloud-lh
# ── Redis (notify_push queue + file-locking cache + session cache) ──
# notify_push (real-time sync) hard-requires a Redis queue; without it occ
# throws RedisException "Connection refused" on every run. Cache/queue data
# is ephemeral (clients reconnect, locks rebuild) → persistence OFF, no PVC,
# not in the backup set. Password: sealed secret nextcloud-redis.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: false
cronjob:
  # Background jobs (preview gen, Deck/Collectives/Notes indexing, activity)
  # were running in AJAX mode (unreliable). Sidecar runs real cron every 5 min.
  enabled: true
  type: sidecar
  sidecar:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # Memories indexing launches perl exiftool (~0.8s CPU). At 250m the
        # CFS stretch blows the app's hardcoded 3s exec timeout → cron logged
        # "Indexing exception: Timeout" every run since the Sep 26 reboot.
        # 1 core = exiftool boots in <1s. Verified by audit Oct 2 2026.
        cpu: 1
        memory: 512Mi
postgresql:
  enabled: false
internalDatabase:
  # ⚠️ CRITICAL (Aug 24 2026): chart defaults internalDatabase.enabled=true which
  # renders SQLITE_DATABASE and IGNORES externalDatabase — Nextcloud ran on SQLite
  # for 19 days because this was missing. Must stay false for Postgres.
  enabled: false
service:
  port: 8080
  type: ClusterIP
# notify_push port needs its own Service (the chart's service only exposes
# 8080): Traefik's /push route targets nextcloud-push:7867.
extraManifests:
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: nextcloud-push
    namespace: private
  spec:
    type: ClusterIP
    ports:
      - name: push
        port: 7867
        targetPort: 7867
    selector:
      app.kubernetes.io/name: nextcloud
externalDatabase:
  enabled: true
  type: postgresql
  host: postgresql.private.svc.cluster.local
  database: nextcloud
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-creds
    usernameKey: username
    passwordKey: password
mariadb:
  enabled: false
livenessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
