apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: private
  sources:
  - repoURL: https://nextcloud.github.io/helm
    chart: nextcloud
    targetRevision: 9.2.5
    helm:
      valueFiles:
      - $values/apps/private/nextcloud/values.yaml
  - repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    path: apps/private/nextcloud/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
