# Family media seed (easystore, ~1.03 TiB, 50k files, mostly video).
#
# Separate volume on purpose: the nightly Longhorn backup target is a 147 GiB
# VPS volume, so putting 1 TiB into nextcloud-nextcloud-lh would make every
# backup fail. Media here is deliberately UNBACKED (the easystore stays as the
# offline copy); everything else in the main data volume keeps its backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-family-media-lh
  namespace: private
  labels:
    recurring-job-group.longhorn.io/default: disabled
  annotations:
    # ArgoCD pruned this PVC during the Nov 11 control-plane outage (target
    # state came back empty while repo-server was down) and took the volume
    # with it. Never prune a data PVC.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 1200Gi
