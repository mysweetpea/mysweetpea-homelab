controllers:
  main:
    containers:
      main:
        image:
          repository: jellyfin/jellyfin
          # JF 12.1 — major DB migration (one-way). Pre-jf12-migration LH snapshot
          # taken 2026-10-02 16:57Z on jellyfin-config-lh. Plugin dirs cleaned
          # while scaled down; 12.x plugin builds reinstalled post-boot.
          tag: "12.2"
        # Device cgroup blocks hostPath-mounted /dev/dri even for root (EPERM on
        # open) - privileged lets the container actually reach the iGPU. Single-
        # tenant node, first-party image; security delta accepted for QSV.
        securityContext:
          privileged: true
        resources:
          # Right-sized Aug 2026: idle draw ~80-150m; transcode bursts go to
          # the 6000m limit. Request was 2000m = 1.9 vCPU of phantom
          # reservation on worker-b (the 97%-committed node).
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 6000m
            # Raised 4Gi -> 6Gi after the Sep 13 OOMKill (hit 3.7GB anon-rss
            # during thread-pool back-pressure from a runaway MdbList warmer;
            # the warmer is fixed at the source, this is headroom against
            # future startup-scan spikes).
            memory: 6Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
  # iGPU (UHD 620) for QSV hardware transcoding: render(991)+video(44) groups
  # from the bare-metal node. Software transcode measured 0.63x realtime on
  # worker-b's laptop CPU - far below playback rate (constant buffering).
  securityContext:
    supplementalGroups: [991, 44]
persistence:
  cache:
    existingClaim: jellyfin-cache-lh
  config:
    existingClaim: jellyfin-config-lh
  media:
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
  # Transcodes in RAM (tmpfs) - instant transcode I/O, no Longhorn network round-trips
  transcodes:
    type: emptyDir
    medium: Memory
    sizeLimit: 2Gi
  # Intel iGPU passthrough for QSV (hardware decode/encode)
  dri:
    type: hostPath
    hostPath: /dev/dri
    globalMounts:
    - path: /dev/dri
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8096
