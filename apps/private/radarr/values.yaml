controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/radarr
          tag: release-6.4.4.10685
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /ping
                port: 7878
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: radarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
  # AIOStreams usenet engine share (strm import mode): RW - arr imports via
  # move (copy + delete source); deletes allowed, creates not. port 12049.
  aio:
    existingClaim: aiostreams-nfs
    globalMounts:
    - path: /mnt/aiostreams
service:
  main:
    controller: main
    ports:
      http:
        port: 7878
    type: LoadBalancer
    loadBalancerIP: 192.168.20.218
    allocateLoadBalancerNodePorts: false
