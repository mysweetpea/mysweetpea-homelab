# ──────────────────────────────────────────────
# Immich Helm Chart 0.12.0 — values.yaml
# Session 15: Nuclear redeploy with VectorChord
# Access: Internal only (ClusterIP, no ingress)
# ──────────────────────────────────────────────

# Shared configuration across all Immich components
# RWO library PVC + replicas=1: chart vendored bjw-s accepts strategy as a
# STRING only; Recreate avoids the RWO surge-pod Multi-Attach stall.
controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          tag: v3.3.0
          repository: ghcr.io/immich-app/immich-server
        env:
          # Database connection (immich-postgresql in private namespace)
          DB_HOSTNAME: immich-postgresql.private.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          # DB_PASSWORD from sealed secret immich-db (sealed-secrets/private/immich-db.yaml)
          DB_DATABASE_NAME: immich
          DB_VECTOR_EXTENSION: vectorchord
          # Redis (bundled Valkey — no password needed)
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          # Security: enable CSP (recommended in v2.7.0 release notes)
          IMMICH_HELMET_FILE: "false"
        envFrom:
        - secretRef:
            name: immich-db
# Immich-specific configuration
immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-library-lh
# Configuration (set via admin UI after first boot)
configuration: {}
configurationKind: ConfigMap
# ── Bundled Valkey (replaces external redis-immich-master) ──
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          persistence:
            data:
              enabled: true
              size: 1Gi
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              storageClass: longhorn
# ── Immich Server ──
server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  # No ingress — internal access only (Option A)
  ingress:
    main:
      enabled: false
# ── Machine Learning ──
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  # Chart 0.12.0 reads ML cache persistence at THIS level — machine-learning.persistence
  # (sibling of controllers; chart default layout). The old controllers.main.persistence
  # nesting was silently ignored → live deploy rendered emptyDir → models re-downloaded
  # on every ML restart. Shape verified by local helm template render Oct 2 2026.
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: longhorn
