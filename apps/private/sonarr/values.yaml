controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/sonarr
          tag: release-4.0.20.3014
        resources:
          requests:
            cpu: 500m
            # Raised 512Mi -> 1Gi 2026-10-11: usenet-era import/scan storms need
            # GC headroom; Sonarr sat at 1.95Gi/2Gi under load.
            memory: 1Gi
          limits:
            cpu: 4000m
            # 5Gi -> 8Gi 2026-10-12: still OOMKill-looping at 5Gi (13 restarts
            # in 17h) while a full-library RefreshSeries pass + overdue RssSync
            # + engine bulk searches ran concurrently; executor ended up wedged
            # with /ping and /queue timing out and memory still climbing (4.4Gi).
            # 294-series library needs the extra GC headroom. Live cgroup was
            # bumped to 8Gi same-day; this commit makes it permanent.
            memory: 8Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /ping
                port: 8989
              initialDelaySeconds: 15
              # Relaxed 2026-10-11 (v2): under fill marathons Sonarr legitimately saturates HTTP
              # and /ping can take 10s+. Evicting a SINGLE-replica app from the LB = total blackhole
              # (no other replica to take traffic). Keep it in the pool; clients retry slow calls.
              periodSeconds: 30
              timeoutSeconds: 30
              failureThreshold: 10
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: sonarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    # single-replica: never blackhole the LB just because the app is briefly slow
    publishNotReadyAddresses: true
    ports:
      http:
        port: 8989
    type: LoadBalancer
    loadBalancerIP: 192.168.20.219
    allocateLoadBalancerNodePorts: false
