controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/sonarr
          tag: release-4.0.20.3014
        resources:
          requests:
            cpu: 500m
            # Raised 512Mi -> 1Gi 2026-10-11: usenet-era import/scan storms need
            # GC headroom; Sonarr sat at 1.95Gi/2Gi under load.
            memory: 1Gi
          limits:
            cpu: 4000m
            # 2Gi -> 5Gi 2026-10-11: OOMKill loop (16 restarts / 11h) under
            # season-pack import backlog: .NET GC thrash at the 2Gi ceiling made
            # /ping, the queue API and decypharr's arr callbacks all time out.
            # 380-series library + usenet fill marathons need real headroom.
            memory: 5Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /ping
                port: 8989
              initialDelaySeconds: 15
              # Relaxed 2026-10-11 (v2): under fill marathons Sonarr legitimately saturates HTTP
              # and /ping can take 10s+. Evicting a SINGLE-replica app from the LB = total blackhole
              # (no other replica to take traffic). Keep it in the pool; clients retry slow calls.
              periodSeconds: 30
              timeoutSeconds: 30
              failureThreshold: 10
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: sonarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    # single-replica: never blackhole the LB just because the app is briefly slow
    publishNotReadyAddresses: true
    ports:
      http:
        port: 8989
    type: LoadBalancer
    loadBalancerIP: 192.168.20.219
    allocateLoadBalancerNodePorts: false
