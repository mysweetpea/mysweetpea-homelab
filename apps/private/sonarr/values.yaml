controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/sonarr
          tag: release-4.0.20.3014
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /ping
                port: 8989
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: sonarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    ports:
      http:
        port: 8989
    type: LoadBalancer
    loadBalancerIP: 192.168.20.219
    allocateLoadBalancerNodePorts: false
