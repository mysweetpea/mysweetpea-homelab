controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/sonarr
          tag: release-4.0.20.3014
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 2Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /ping
                port: 8989
              initialDelaySeconds: 15
              # Relaxed 2026-10-11: under heavy fill marathons Sonarr legitimately saturates CPU
              # and /ping can take >3s -> probe flapped it off the LB while it was working fine.
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 6
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: sonarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    ports:
      http:
        port: 8989
    type: LoadBalancer
    loadBalancerIP: 192.168.20.219
    allocateLoadBalancerNodePorts: false
