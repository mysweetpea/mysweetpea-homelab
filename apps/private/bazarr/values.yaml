controllers:
  main:
    replicas: 0  # PAUSED 2026-10-13 — AIOStreams test window (media pipeline hold)
    containers:
      main:
        image:
          repository: ghcr.io/hotio/bazarr
          tag: release-v1.6.2
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 1000m
            # Raised 512Mi -> 1Gi after recurring OOMKills at 04:02 (the Longhorn
            # daily-backup window): subtitle library grows + backup I/O spikes
            # pushed it past the old limit ~daily, causing false DOWN blips.
            memory: 1Gi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /
                port: 6767
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: bazarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.20.223"
    allocateLoadBalancerNodePorts: false
    ports:
      http:
        port: 6767
