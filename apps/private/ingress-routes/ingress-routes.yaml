---
# n8n — n8n.mysweetpea.cc + subscribe.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`n8n.mysweetpea.cc`) || Host(`subscribe.mysweetpea.cc`)
      kind: Rule
      services:
        - name: n8n
          port: 5678
---
# Open WebUI — chat.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ai.mysweetpea.cc`)
      kind: Rule
      services:
        - name: open-webui
          port: 8080
---
# Nextcloud — cloud.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    # notify_push websocket endpoint (real-time sync; sidecar on 7867)
    - match: Host(`cloud.mysweetpea.cc`) && PathPrefix(`/push`)
      kind: Rule
      services:
        - name: nextcloud-push
          port: 7867
    - match: Host(`cloud.mysweetpea.cc`)
      kind: Rule
      services:
        - name: nextcloud
          port: 8080
---
# Immich — photos.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`photos.mysweetpea.cc`) && Path(`/custom.css`)
      kind: Rule
      middlewares:
        - name: immich-custom-css-revalidate
      services:
        - name: immich-lb
          port: 2283
    - match: Host(`photos.mysweetpea.cc`)
      kind: Rule
      services:
        - name: immich-lb
          port: 2283
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-custom-css-revalidate
  namespace: private
spec:
  headers:
    customResponseHeaders:
      Cache-Control: no-cache
---
# Gotify — gotify.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gotify
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`gotify.mysweetpea.cc`)
      kind: Rule
      services:
        - name: gotify
          port: 80
---
# iGotify Notification Assist — igotify.mysweetpea.cc (iOS push bridge)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: igotify-assist
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`igotify.mysweetpea.cc`)
      kind: Rule
      services:
        - name: igotify-assist
          port: 80
---
# Jellyfin — media.mysweetpea.cc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: private
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`media.mysweetpea.cc`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
