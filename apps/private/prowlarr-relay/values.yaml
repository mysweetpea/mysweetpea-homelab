# prowlarr-relay: lets the VPS-hosted AIOStreams instance reach home-restricted indexers.
#
# Why this exists (verified 2026-10-13):
#  - Prowlarr HARDCODES 302 redirects for usenet indexers: NewznabController.cs
#    "if (indexer.Protocol == DownloadProtocol.Usenet || ...) return RedirectPermanent(...)"
#    and the indexer validator refuses Redirect=false for usenet, so Prowlarr can never
#    proxy an NZB download -- the client always ends up fetching the indexer directly.
#  - NZBFinder is Cloudflare-protected and 403s datacenter IPs, so the VPS can neither
#    search it (api returns 403) nor fetch its NZBs (redirect target 403s).
#  - Home IP can do both. This relay runs AT HOME:
#      /api/v1/*       -> reverse-proxies to Prowlarr (search), Host header rewritten to
#                         SELF_HOST so Prowlarr's returned download URLs point back here.
#      /{id}/download  -> base64-decodes the `link` param (the indexer's direct URL),
#                         fetches it from the home IP, returns the NZB bytes.
#      /healthz        -> 200.
#    Fetch targets are allow-listed (FETCH_ALLOWLIST) to keep this from being a generic
#    SSRF hole. Reachable on home LAN / NetBird only -- no public ingress.
#
# Consumer: AIOStreams "Prowlarr" preset with
#   Prowlarr URL = http://192.168.20.235:9697 , tick ONLY NZBFinder.
# (NZBGeek / NZBPlanet keep their direct Newznab presets -- no home hop needed.)
configMaps:
  relay:
    enabled: true
    data:
      relay.py: |
        import gzip, os, sys, urllib.parse, urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.error import HTTPError

        class _Redirect(Exception):
            def __init__(self, url):
                self.url = url

        class _CaptureRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                raise _Redirect(newurl)

        _capture = urllib.request.build_opener(_CaptureRedirect)

        PROWLARR = os.environ.get("PROWLARR_URL", "http://prowlarr.private.svc.cluster.local:9696")
        SELF_HOST = os.environ.get("SELF_HOST", "192.168.20.235:9697")
        ALLOW = tuple(h.strip().lower() for h in os.environ.get("FETCH_ALLOWLIST", "nzbfinder.ws").split(",") if h.strip())
        # NZBFinder's getnzb endpoint rejects unknown client UAs with an "update
        # Prowlarr" XML error (code 203); a browser UA is accepted (measured 2026-10-13).
        UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"

        def fetch(url, headers=None, timeout=45):
            req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Encoding": "identity", **(headers or {})})
            with urllib.request.urlopen(req, timeout=timeout) as r:
                body = r.read()
                if r.headers.get("Content-Encoding", "").lower() == "gzip":
                    body = gzip.decompress(body)
                return r.status, r.headers, body

        class H(BaseHTTPRequestHandler):
            server_version = "prowlarr-relay/1.0"

            def log_message(self, fmt, *args):
                sys.stderr.write("[relay] %s %s\n" % (self.address_string(), fmt % args))

            def _send(self, code, body, ctype="text/plain; charset=utf-8", extra=None):
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                for k, v in (extra or {}).items():
                    self.send_header(k, v)
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                u = urllib.parse.urlsplit(self.path)
                q = urllib.parse.parse_qs(u.query)
                try:
                    if u.path == "/healthz":
                        return self._send(200, b"ok")
                    if u.path.startswith("/api/v1/"):
                        key = self.headers.get("X-Api-Key") or (q.get("apikey") or [""])[0]
                        hdrs = {"Host": SELF_HOST}
                        if key:
                            hdrs["X-Api-Key"] = key
                        up = PROWLARR + u.path + (("?" + u.query) if u.query else "")
                        code, rheaders, body = fetch(up, hdrs)
                        return self._send(code, body, rheaders.get("Content-Type", "application/json"))
                    if u.path.endswith("/download"):
                        # Let Prowlarr do its own link decoding: forward the request and
                        # capture the 301/302 it returns (it always redirects usenet),
                        # then fetch that target ourselves from the home IP.
                        up = PROWLARR + u.path + (("?" + u.query) if u.query else "")
                        hdrs = {"Host": SELF_HOST}
                        key = self.headers.get("X-Api-Key") or ""
                        if key:
                            hdrs["X-Api-Key"] = key
                        try:
                            _capture.open(urllib.request.Request(up, headers={"User-Agent": UA, **hdrs}), timeout=30)
                            return self._send(502, b"prowlarr did not redirect")
                        except _Redirect as r:
                            target = r.url
                        except HTTPError as he:
                            return self._send(502, ("prowlarr error: %s" % he).encode())
                        host = (urllib.parse.urlsplit(target).hostname or "").lower()
                        if not any(host == h or host.endswith("." + h) for h in ALLOW):
                            return self._send(403, ("host not allowed: %s" % host).encode())
                        code, rheaders, body = fetch(target)
                        name = (q.get("file") or ["download.nzb"])[0].replace('"', "")
                        return self._send(200, body, "application/x-nzb",
                                          {"Content-Disposition": 'attachment; filename="%s"' % name})
                    return self._send(404, b"not found")
                except Exception as e:
                    sys.stderr.write("[relay] ERROR %s: %s\n" % (self.path, e))
                    return self._send(502, ("relay error: %s" % e).encode())

        if __name__ == "__main__":
            port = int(os.environ.get("PORT", "9697"))
            sys.stderr.write("[relay] listening :%d prowlarr=%s self=%s allow=%s\n" % (port, PROWLARR, SELF_HOST, ",".join(ALLOW)))
            ThreadingHTTPServer(("0.0.0.0", port), H).serve_forever()
controllers:
  main:
    containers:
      main:
        image:
          repository: python
          tag: 3.12-alpine
        command: ["python3", "/app/relay.py"]
        env:
        - name: PROWLARR_URL
          value: http://prowlarr.private.svc.cluster.local:9696
        - name: SELF_HOST
          value: "192.168.20.235:9697"
        - name: FETCH_ALLOWLIST
          value: nzbfinder.ws
        - name: PORT
          value: "9697"
        ports:
        - name: http
          containerPort: 9697
          protocol: TCP
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9697
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9697
              initialDelaySeconds: 2
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 3
service:
  main:
    controller: main
    ports:
      http:
        port: 9697
    type: LoadBalancer
    loadBalancerIP: 192.168.20.235
    allocateLoadBalancerNodePorts: false
persistence:
  relay:
    type: configMap
    identifier: relay
    globalMounts:
    - path: /app/relay.py
      subPath: relay.py
      readOnly: true
