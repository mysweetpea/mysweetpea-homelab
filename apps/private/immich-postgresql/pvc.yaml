apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-immich-postgresql-0
  namespace: private
  labels:
    app.kubernetes.io/name: immich-postgresql
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 8Gi
