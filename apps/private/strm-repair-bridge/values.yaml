# strm-repair-bridge — heal dead .strm library entries end-to-end.
#
# The problem it closes: Decypharr's native repair worker can DETECT broken
# entries for our zero-storage strm setup, but its built-in repair only
# reaches the Arrs through symlink resolution (collectArrFiles ->
# readSymlinkTarget); strm files aren't symlinks, so broken files never get
# Arr file IDs attached and no blocklist/re-search ever happens. Dead strms
# then 404 at playback until manually fixed.
#
# This bridge reads Decypharr's entry-health state, maps broken entries to
# their .strm files by SCANNING STRM CONTENT (each strm's webdav URL names
# its entry — exact, no name fuzziness), joins strm paths to Radarr/Sonarr
# file records, and runs the arr-side remediation: delete dead file ->
# blocklist grab -> re-search. Runs every 6h: empirical streamability sweep + capped arr-side repairs.
#
# Safety: dry-run default; provider-down guard (>90% of a sweep broken =>
# skip, means outage); per-run action cap; settle cooldown; re-act only when
# an entry fails AGAIN after our action (no blocklist churn).
controllers:
  main:
    type: cronjob
    cronjob:
      schedule: "0 */6 * * *"    # 4x/day: sweep lane + capped repairs while the legacy backlog drains
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 900
      successfulJobsHistory: 3
      failedJobsHistory: 3
      backoffLimit: 1
    pod:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: python
          tag: "3.12-alpine"
        command:
        - /bin/sh
        - -c
        - |
          # 200 repairs/run x 4 runs/day while the legacy client_not_found
          # backlog drains; drop the schedule back to daily once clean.
          python3 /scripts/strm-repair-bridge.py --execute --limit 200
        env:
        - name: DECY_API
          value: "http://decypharr.private.svc.cluster.local:8282"
        - name: RADARR_API
          value: "http://radarr.private.svc.cluster.local:7878"
        - name: SONARR_API
          value: "http://sonarr.private.svc.cluster.local:8989"
        - name: DECY_STATE_DIR
          value: "/decy-state"
        - name: SCAN_ROOT
          value: "/data/media"
        - name: STATE_FILE
          value: "/decy-state/strm-repair-ledger.json"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: SWEEP_WORKERS
          value: "6"
        - name: SWEEP_DEADLINE_S
          value: "1800"
        - name: JELLYFIN_API
          value: "http://jellyfin.private.svc.cluster.local:8096"
        - name: RADARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: decypharr-secrets
              key: DECYPHARR_ARRS__0__TOKEN
        - name: SONARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: decypharr-secrets
              key: DECYPHARR_ARRS__1__TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
configMaps:
  script:
    enabled: true
    data:
      strm-repair-bridge.py: |
        #!/usr/bin/env python3
        """
        strm-repair-bridge — connect Decypharr's strm health detections to
        Radarr/Sonarr blocklist + re-search.

        Why this exists
        ---------------
        Our library is zero-storage .strm (Decypharr webdav pointers), NOT symlinks.
        Decypharr v2.5's native repair worker can *detect* broken entries for this
        setup (source=managed probes every managed entry's provider link), but its
        built-in repair is symlink-gated: `collectArrFiles()` resolves Arr file paths
        via `readSymlinkTarget()` and strm files aren't symlinks, so broken files
        never get Arr file IDs attached → no blocklist, no re-search. Dead strms then
        sit in the library 404ing at playback until manually fixed (this is exactly
        why ~60 dead YTS strms lingered).

        This bridge supplies the missing link. It:

          0. empirically sweeps EVERY strm (ranged GET on the exact webdav URL
             Jellyfin plays) - the only detection source that catches the legacy
             client_not_found class, which Decypharr's own probe reports healthy,
          1. reads Decypharr's entry-health state (broken entries + failure reasons),
          2. maps each broken entry to the .strm files that reference it by SCANNING
             STRM CONTENT — every strm's first line is
               http://decypharr.../webdav/stream/__all__/<URL-ENCODED ENTRY>/<file>
             so the entry→strm mapping is exact, no name fuzziness. (Fallback name
             matching covers strms that predate the /stream/ shape.)
          3. maps strm path → Arr file record (Radarr moviefile.path / Sonarr
             episodefile.path are absolute in-container paths, exact match),
          4. drives Arr-side remediation:
               Radarr: DELETE /api/v3/moviefile/{id}
                       POST   /api/v3/history/failed/{histId}   (blocklist; arr
                              auto-re-searches when autoRedownloadFailed=true)
                       POST   /api/v3/command MoviesSearch {movieIds:[...]}
               Sonarr: DELETE /api/v3/episodefile/{id}
                       POST   /api/v3/history/failed/{histId}
                       POST   /api/v3/command EpisodeSearch {episodeIds:[...]}

        Safety rails (all mandatory):
          * --dry-run is the DEFAULT; --execute performs actions.
          * PROVIDER-DOWN GUARD: when the freshest sweep probed ≥20 entries and
            ≥90% came back broken, the pass is skipped (mass failure = provider
            outage, not per-release death). Mirrors JellySTRMprobe
            DeleteFailureThreshold=99 semantics.
          * Per-run action cap (MAX_ACTIONS_PER_RUN) bounds first-time burn-in.
          * Cooldown ledger — an entry is not re-processed for ARR_SETTLE_HOURS
            (replacement needs time to land).
          * Only entries Decypharr independently marks `broken` are acted on.

        Usage:
          strm-repair-bridge.py [--dry-run|--execute] [--limit N]
                                [--strm-index /path/index.json]  # offline test mode
                                [--scan-root /data/media]

        Deployed as a CronJob after the nightly Decypharr sweep.
        """

        import argparse
        import concurrent.futures
        import json
        import os
        import re
        import subprocess
        import sys
        import time
        import urllib.error
        import urllib.parse
        import urllib.request
        from datetime import datetime, timedelta, timezone

        # ---------------------------------------------------------------- config

        DECY_API = os.environ.get("DECY_API", "http://decypharr.private.svc.cluster.local:8282")
        RADARR_API = os.environ.get("RADARR_API", "http://radarr.private.svc.cluster.local:7878")
        SONARR_API = os.environ.get("SONARR_API", "http://sonarr.private.svc.cluster.local:8989")
        RADARR_KEY = os.environ.get("RADARR_API_KEY", "")
        SONARR_KEY = os.environ.get("SONARR_API_KEY", "")
        DECY_TOKEN = os.environ.get("DECY_API_TOKEN", "")

        SCAN_ROOT = os.environ.get("SCAN_ROOT", "/data/media")
        TV_ROOT = os.environ.get("TV_ROOT", "/data/media/tv")
        STATE_FILE = os.environ.get("STATE_FILE", "/data/.strm-repair-ledger.json")
        SWEEP_DEADLINE_S = int(os.environ.get("SWEEP_DEADLINE_S", "1800"))
        JELLYFIN_API = os.environ.get("JELLYFIN_API", "http://jellyfin.private.svc.cluster.local:8096")
        JELLYFIN_API_KEY = os.environ.get("JELLYFIN_API_KEY", "")

        PROVIDER_DOWN_PCT = float(os.environ.get("PROVIDER_DOWN_PCT", "90"))
        MAX_ACTIONS_PER_RUN = int(os.environ.get("MAX_ACTIONS_PER_RUN", "25"))
        ARR_SETTLE_HOURS = float(os.environ.get("ARR_SETTLE_HOURS", "6"))

        HTTP_TIMEOUT = 45
        WEBDAV_MARKER = "/webdav/"


        def log(msg: str) -> None:
            print(f"[{datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')}] {msg}", flush=True)


        def parse_dt(s):
            """Parse Decypharr timestamps (nanosecond precision, tz offset) safely."""
            if not s:
                return None
            try:
                s2 = s.replace("Z", "+00:00")
                if "." in s2:
                    head, rest = s2.split(".", 1)
                    frac, tz = "", ""
                    for i, ch in enumerate(rest):
                        if ch.isdigit():
                            frac += ch
                        else:
                            tz = rest[i:]
                            break
                    s2 = f"{head}.{frac[:6]}{tz}"
                dt = datetime.fromisoformat(s2)
                if dt.tzinfo is None:
                    dt = dt.replace(tzinfo=timezone.utc)
                return dt
            except Exception:  # noqa: BLE001
                return None


        def http_json(url, method="GET", headers=None, body=None, timeout=HTTP_TIMEOUT):
            req = urllib.request.Request(url, method=method, headers=headers or {})
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                req.add_header("Content-Type", "application/json")
            try:
                with urllib.request.urlopen(req, data=data, timeout=timeout) as resp:
                    raw = resp.read()
                    if not raw:
                        return resp.status, None
                    try:
                        return resp.status, json.loads(raw)
                    except json.JSONDecodeError:
                        return resp.status, raw.decode(errors="replace")
            except urllib.error.HTTPError as e:
                return e.code, e.read().decode(errors="replace")
            except Exception as e:  # noqa: BLE001
                return 0, str(e)


        def decy_token() -> str:
            """Read Decypharr's API token live.

            Order: explicit env override, then the shared state PVC (the CronJob
            mounts decypharr-state-lh at DECY_STATE_DIR so it always sees the
            CURRENT token — Decypharr regenerates it if auth.json is ever wiped),
            then a direct file in this container."""
            global DECY_TOKEN
            if DECY_TOKEN:
                return DECY_TOKEN
            state_dir = os.environ.get("DECY_STATE_DIR", "")
            for path in filter(None, [
                os.path.join(state_dir, "auth.json") if state_dir else "",
                "/app/auth.json",
            ]):
                try:
                    with open(path) as f:
                        tok = json.load(f).get("api_token", "")
                    if tok:
                        return tok
                except Exception:  # noqa: BLE001
                    continue
            return ""


        # ---------------------------------------------------------------- strm scanning

        def entry_from_strm_url(line: str):
            """Extract the Decypharr entry name from a strm's first line.
            Shapes seen in the wild:
              .../webdav/stream/__all__/<ENCODED ENTRY>/<file>
              .../webdav/<category>/<ENCODED ENTRY>/<file>
            Returns the decoded entry name or None."""
            line = (line or "").strip()
            if WEBDAV_MARKER not in line:
                return None
            tail = line.split(WEBDAV_MARKER, 1)[1]
            parts = [p for p in tail.split("/") if p]
            if not parts:
                return None
            # ['stream', '__all__', '<entry>', '<file>']  or  ['<category>', '<entry>', '<file>']
            if len(parts) >= 3 and parts[0] == "stream":
                return urllib.parse.unquote(parts[2]), urllib.parse.unquote(parts[3]) if len(parts) > 3 else ""
            if len(parts) >= 2:
                return urllib.parse.unquote(parts[1]), urllib.parse.unquote(parts[2]) if len(parts) > 2 else ""
            return None


        def scan_strm_index(root: str):
            """Walk root for *.strm, return {strm_path: entry_name}."""
            idx = {}
            for dirpath, _dirs, files in os.walk(root):
                for fn in files:
                    if not fn.endswith(".strm"):
                        continue
                    p = os.path.join(dirpath, fn)
                    try:
                        with open(p, "r", errors="replace") as f:
                            line = f.readline()
                    except Exception:  # noqa: BLE001
                        continue
                    got = entry_from_strm_url(line)
                    if got:
                        idx[p] = got[0]
            return idx


        def load_strm_index_file(path):
            with open(path) as f:
                return json.load(f)


        def file_from_strm(strm_path):
            """Read a strm's first line and return the FILE component of its URL
            (needed for multi-file entries where file name != entry name)."""
            try:
                with open(strm_path, "r", errors="replace") as f:
                    line = f.readline()
            except Exception:  # noqa: BLE001
                return ""
            if WEBDAV_MARKER not in line:
                return ""
            tail = line.strip().split(WEBDAV_MARKER, 1)[1]
            parts = [p for p in tail.split("/") if p]
            if len(parts) >= 4 and parts[0] == "stream":
                return urllib.parse.unquote(parts[3])
            if len(parts) >= 3:
                return urllib.parse.unquote(parts[2])
            return ""


        def _by_entry(raw_index):
            out = {}
            for sp, e in raw_index.items():
                out.setdefault(e, []).append(sp)
            return out


        def sweep_dead_entries(raw_index, workers=None):
            """Empirically probe EVERY strm's webdav URL - the same endpoint Jellyfin
            plays from - because Decypharr's own health probe is blind to the legacy
            client_not_found class (entry reports healthy, playback 500s).

            Dead results are double-probed so transients never trigger repairs.
            A wall-clock deadline fails safe: files not reached in time count as
            alive (no action). Returns ({entry_name: detection}, stats)."""
            workers = workers or int(os.environ.get("SWEEP_WORKERS", "6"))
            deadline = time.monotonic() + SWEEP_DEADLINE_S

            def probe(item, guarded=True):
                entry, sp = item
                if guarded and time.monotonic() > deadline:
                    return sp, "ok"  # fail safe: treat as alive
                try:
                    with open(sp, "r", errors="replace") as f:
                        url = f.readline().strip()
                except Exception:  # noqa: BLE001
                    url = ""
                if not url:
                    fn = file_from_strm(sp) or entry
                    url = (f"{DECY_API}/webdav/stream/__all__/"
                           f"{urllib.parse.quote(entry, safe='')}/{urllib.parse.quote(fn, safe='')}")
                req = urllib.request.Request(url, headers={"Range": "bytes=0-2047"})
                try:
                    with urllib.request.urlopen(req, timeout=10) as resp:
                        resp.read(64)
                        return sp, "ok"
                except urllib.error.HTTPError as e:
                    body = b""
                    try:
                        body = e.read()[:300]
                    except Exception:  # noqa: BLE001
                        pass
                    # "file is gone" signature vs "backend having a moment": only the
                    # former may ever trigger a repair (2026-10-12 eviction-storm lesson:
                    # decypharr died mid-sweep and unreachable files must NOT look dead).
                    if e.code in (404, 410, 451) or b"client_not_found" in body:
                        return sp, "dead"
                    if 400 <= e.code < 500 and e.code != 429:
                        return sp, "dead"
                    return sp, "offline"
                except Exception:  # noqa: BLE001
                    return sp, "offline"

            tasks = [(e, s) for e, ss in _by_entry(raw_index).items() for s in ss]
            dead1, offline1 = [], 0
            with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
                for sp, st in ex.map(probe, tasks, chunksize=16):
                    if st == "dead":
                        dead1.append(sp)
                    elif st == "offline":
                        offline1 += 1
            # Backend-outage gate (2026-10-12): if a large share of the library is
            # UNREACHABLE (not HTTP-dead - connection-level failure), the streaming
            # backend itself is sick (e.g. decypharr evicted mid-sweep by its cache
            # limit). No death verdicts are trustworthy then, and continuing to hammer
            # it feeds the crash loop. Abort; the next run retries.
            if tasks and offline1 > 50 and offline1 / len(tasks) > 0.3:
                log(f"sweep ABORTED: {offline1}/{len(tasks)} unreachable - "
                    f"streaming backend outage suspected")
                return {}, {"probed": len(tasks), "alive": len(tasks) - len(dead1) - offline1,
                            "dead_files": 0, "dead_entries": 0, "offline": offline1,
                            "aborted": True}
            still_dead = []
            if dead1:
                # NOT deadline-guarded: a fail-safe "alive" here would exonerate the
                # dead set wholesale (this exact bug nuked the first production run).
                # Bounded naturally: only dead candidates, each with a 10 s timeout.
                # "offline" on the re-probe defers the entry (never repaired blind).
                with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
                    for sp, st in ex.map(lambda a: probe(a, False), [(raw_index[s], s) for s in dead1], chunksize=8):
                        if st == "dead":
                            still_dead.append(sp)
            dead_entries = {}
            for sp in still_dead:
                e = raw_index[sp]
                d = dead_entries.setdefault(e, {
                    "entry_name": e, "status": "sweep_dead", "src": "sweep",
                    "failure_reason": "not_streamable", "dead_files": [],
                })
                d["dead_files"].append(sp)
            stats = {"probed": len(tasks), "alive": len(tasks) - len(dead1) - offline1,
                     "dead_files": len(still_dead), "dead_entries": len(dead_entries),
                     "offline": offline1, "aborted": False}
            return dead_entries, stats


        KUMA_PUSH_FILE = os.environ.get("KUMA_PUSH_FILE", "/decy-state/kuma-push-url.txt")


        def kuma_push(status, msg):
            """Beat the Kuma push monitor (dead-man's switch + anomaly alerts).

            URL comes from KUMA_PUSH_URL or the state-PVC file - never from git
            (public repo; a leaked push token would allow only alert spam, but
            still)."""
            url = os.environ.get("KUMA_PUSH_URL", "").strip()
            if not url:
                try:
                    with open(KUMA_PUSH_FILE) as f:
                        url = f.readline().strip()
                except Exception:  # noqa: BLE001
                    url = ""
            if not url:
                log("kuma push: no URL configured (skipping)")
                return
            try:
                q = urllib.parse.urlencode({"status": status, "msg": msg[:250]})
                with urllib.request.urlopen(f"{url}?{q}", timeout=10) as resp:
                    resp.read(64)
                log(f"kuma push: {status} - {msg[:120]}")
            except Exception as e:  # noqa: BLE001
                log(f"WARN: kuma push failed: {e}")


        def jf_probe_failures(raw_index):
            """Probe-Provider failures from Jellyfin's own server log.

            Files whose deep ffprobe keeps failing (truncated / sick usenet grabs)
            answer the sweep's 2 KB range read happily, so the sweep can't see them -
            but every playback pays a failed 30-45 s re-probe (PlaybackInfo timeout,
            app gives up at 30 s). Jellyfin literally logs the failures; harvest them.

            Requires >= 2 failures within today's + yesterday's logs. Carries the
            LATEST failure timestamp as last_failed_at so the existing settle gate
            stops re-acting once a replacement has landed."""
            key = JELLYFIN_API_KEY
            if not key:
                try:
                    key = json.load(open("/decy-state/bridge-config.json")).get("jellyfin_api_key", "")
                except Exception:  # noqa: BLE001
                    key = ""
            if not key:
                log("jf-probe lane: no JELLYFIN_API_KEY (env or bridge-config.json) - skipping")
                return {}
            base = JELLYFIN_API.rstrip("/")
            auth = {"Authorization": f'MediaBrowser Token="{key}"'}

            def fetch(path):
                req = urllib.request.Request(f"{base}{path}", headers=auth)
                with urllib.request.urlopen(req, timeout=60) as resp:
                    return resp.read().decode("utf-8", "replace")

            try:
                logs = json.loads(fetch("/System/Logs"))
                names = sorted(l["Name"] for l in logs if str(l.get("Name", "")).startswith("log_"))
            except Exception as e:  # noqa: BLE001
                log(f"jf-probe lane: cannot list jellyfin logs: {e}")
                return {}
            counts, latest = {}, {}
            pat = re.compile(
                r"^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})[^\]]*\] \[ERR\][^\n]*?"
                r'Error in "Probe Provider" for "([^"]+)"',
                re.M,
            )
            for name in names[-2:]:
                try:
                    text = fetch(f"/System/Logs/Log?name={urllib.parse.quote(name)}")
                except Exception as e:  # noqa: BLE001
                    log(f"jf-probe lane: cannot fetch {name}: {e}")
                    continue
                for m in pat.finditer(text):
                    p = m.group(2)
                    if not p.startswith("/data/media/"):
                        continue
                    counts[p] = counts.get(p, 0) + 1
                    latest[p] = max(latest.get(p, ""), m.group(1))

            norm_index = {}
            for sp in raw_index:
                norm_index[sp[:-5] if sp.endswith(".strm") else sp] = sp
            out, unmatched = {}, 0
            for p, n in counts.items():
                if n < 2:
                    continue
                key = p[:-5] if p.endswith(".strm") else p
                sp = norm_index.get(key)
                if not sp:
                    unmatched += 1
                    continue
                e = raw_index[sp]
                iso = latest[p].replace(" ", "T") + "+00:00"
                d = out.setdefault(e, {
                    "entry_name": e, "status": "jf_probe_failed", "src": "jfprobe",
                    "failure_reason": "jellyfin_probe_failed", "last_failed_at": iso,
                })
                d["last_failed_at"] = max(d["last_failed_at"], iso)
            log(f"jf-probe lane: failing paths={len(counts)} candidates={len(out)} "
                f"(unmatched={unmatched}; need >=2 occurrences in 48h)")
            return out


        # ---------------------------------------------------------------- decypharr side

        class Decypharr:
            def __init__(self, token: str):
                self.h = {"Authorization": f"Bearer {token}"}

            def repair_runs(self):
                st, d = http_json(f"{DECY_API}/api/repair/runs", headers=self.h)
                if st != 200:
                    raise RuntimeError(f"repair/runs failed: {st} {d}")
                return d if isinstance(d, list) else d.get("runs", d.get("items", []))

            def health_all(self):
                broken = {}
                offset = 0
                while True:
                    st, d = http_json(
                        f"{DECY_API}/api/repair/health?limit=500&offset={offset}", headers=self.h
                    )
                    if st != 200:
                        raise RuntimeError(f"repair/health failed: {st} {d}")
                    items = d if isinstance(d, list) else d.get("items", d.get("health", []))
                    if not items:
                        break
                    for x in items:
                        if x.get("status") == "broken" and x.get("entry_name"):
                            broken[x["entry_name"]] = x
                    if len(items) < 500:
                        break
                    offset += 500
                    if offset > 40000:
                        break
                return list(broken.values())

            def bad_flag_entries(self):
                """Entries in Decypharr's internal __bad__ set (entry.Bad sticky flag).

                THE DEAD ZONE this bridge exists to close: when the link service marks
                an entry bad, streaming short-circuits with 500 "can't repair <name>
                since it's been marked as bad". The health PROBE can still report the
                same entry 'healthy' (RD's /unrestrict/check passes) even though the
                real unrestrict fails (observed: 451 infringing_file on DMCA'd YTS
                releases), so the repair sweep never selects it, /api/repair/fix
                returns "no fixable broken entries", and recheck?fix=true does NOT
                clear the flag. Without this source those entries 404 forever.
                Detected via the __bad__ browse folder.
                """
                st, d = http_json(f"{DECY_API}/api/browse/__bad__", headers=self.h)
                if st != 200:
                    return []
                entries = d.get("entries", d if isinstance(d, list) else [])
                out = {}
                for e in entries:
                    name = e.get("name", "")
                    if name:
                        out[name] = {
                            "entry_name": name,
                            "status": "bad_flag",
                            "failure_reason": "marked_as_bad",
                        }
                return list(out.values())

            def streamable(self, entry_name, file_name=None):
                """Empirically test whether an entry actually streams.

                Hits the SAME webdav/stream endpoint Jellyfin plays from, with a
                ranged GET. 200/206 proves bytes flow; anything else (412/451/500/
                timeout) means the release is dead for playback. (browse/download
                is the wrong endpoint here — it 302-redirects even for live entries.)

                This exists because the health PROBE's verdict can disagree with
                real streamability (RD's /unrestrict/check passes while the real
                unrestrict 451s). The bridge verifies before destructive action so
                a resurrected or false-flagged entry is never deleted.
                """
                fn = file_name or entry_name
                enc_e = urllib.parse.quote(entry_name, safe="")
                enc_f = urllib.parse.quote(fn, safe="")
                url = f"{DECY_API}/webdav/stream/__all__/{enc_e}/{enc_f}"
                req = urllib.request.Request(url, headers={"Range": "bytes=0-2047"})
                try:
                    with urllib.request.urlopen(req, timeout=40) as resp:
                        resp.read(64)  # prove bytes flow
                        return resp.status in (200, 206)
                except urllib.error.HTTPError:
                    return False
                except Exception:  # noqa: BLE001
                    return False


        # ---------------------------------------------------------------- arr side

        class Arr:
            def __init__(self, base, key, name):
                self.base, self.key, self.name = base, key, name

            def api(self, path, method="GET", body=None):
                return http_json(
                    f"{self.base}{path}", method=method, headers={"X-Api-Key": self.key}, body=body
                )

            def moviefiles(self):
                st, movies = self.api("/api/v3/movie")
                if st != 200 or not isinstance(movies, list):
                    return []
                out = []
                for m in movies:
                    mf = m.get("movieFile")
                    if mf and mf.get("path"):
                        mf["movieId"] = m.get("id")
                        out.append(mf)
                return out

            def api_retry(self, path, method="GET", body=None, attempts=3):
                """Arr calls that survive Sonarr's slow windows (its /series list can
                take >30s while the box grinds); loud, retried, never swallowed."""
                st, d = 0, None
                for i in range(attempts):
                    st, d = self.api(path, method, body)
                    if st == 200:
                        return st, d
                    if i < attempts - 1:
                        time.sleep(5)
                log(f"WARN: {self.name} {method} {path} failed after {attempts} attempts: {st} {str(d)[:90]}")
                return st, d

            def episodefiles_for(self, candidate_strms):
                """TV index scoped to the series that own a candidate strm.

                The old full walk (every series x 2 calls) silently produced an EMPTY
                index whenever /api/v3/series hiccuped during Sonarr's slow windows -
                so TV repairs never happened at all. Scoped, retried, and loud now."""
                need = set()
                for sp in candidate_strms:
                    if not sp.startswith(TV_ROOT + os.sep):
                        continue
                    rel = os.path.relpath(sp, TV_ROOT)
                    top = rel.split(os.sep, 1)[0]
                    if top and top not in (".", ".."):
                        need.add(top)
                if not need:
                    return []
                st, series = self.api_retry("/api/v3/series")
                if st != 200 or not isinstance(series, list):
                    log(f"ERROR: sonarr series list unavailable ({st}); TV repairs skipped this run")
                    return []
                out = []
                for s in series:
                    if os.path.basename((s.get("path") or "").rstrip("/")) not in need:
                        continue
                    sid = s.get("id")
                    st2, files = self.api_retry(f"/api/v3/episodefile?seriesId={sid}")
                    if st2 != 200 or not isinstance(files, list):
                        log(f"ERROR: sonarr episodefile seriesId={sid} failed ({st2})")
                        continue
                    # build episodeFileId -> episodeId map from the episode list
                    st3, eps = self.api_retry(f"/api/v3/episode?seriesId={sid}")
                    file_to_ep = {}
                    if st3 == 200 and isinstance(eps, list):
                        for e in eps:
                            if e.get("episodeFileId"):
                                file_to_ep[e["episodeFileId"]] = e.get("id")
                    for f in files:
                        if f.get("path"):
                            f["seriesId"] = sid
                            f["episodeId"] = file_to_ep.get(f.get("id"))
                            out.append(f)
                return out

            def history_for_movie(self, movie_id):
                st, d = self.api(f"/api/v3/history/movie?movieId={movie_id}")
                return d if st == 200 and isinstance(d, list) else []

            def history_for_series(self, series_id):
                st, d = self.api(f"/api/v3/history/series?seriesId={series_id}")
                return d if st == 200 and isinstance(d, list) else []

            def delete_file(self, kind, file_id):
                ep = "moviefile" if kind == "movie" else "episodefile"
                req = urllib.request.Request(
                    f"{self.base}/api/v3/{ep}/{file_id}",
                    method="DELETE",
                    headers={"X-Api-Key": self.key},
                )
                try:
                    with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                        return r.status in (200, 204)
                except Exception:  # noqa: BLE001
                    return False

            def mark_failed(self, history_id):
                st, _ = self.api(f"/api/v3/history/failed/{history_id}", method="POST")
                return st in (200, 201, 202, 204)

            def search(self, body):
                st, _ = self.api("/api/v3/command", method="POST", body=body)
                return st in (200, 201)


        # ---------------------------------------------------------------- ledger

        def load_ledger():
            try:
                with open(STATE_FILE) as f:
                    return json.load(f)
            except Exception:  # noqa: BLE001
                return {}


        def save_ledger(led):
            d = os.path.dirname(STATE_FILE)
            if d:
                os.makedirs(d, exist_ok=True)
            tmp = STATE_FILE + ".tmp"
            with open(tmp, "w") as f:
                json.dump(led, f, indent=1)
            os.replace(tmp, STATE_FILE)


        # ---------------------------------------------------------------- main

        def main():
            ap = argparse.ArgumentParser()
            g = ap.add_mutually_exclusive_group()
            g.add_argument("--dry-run", action="store_true", default=True)
            g.add_argument("--execute", action="store_true", default=False)
            ap.add_argument("--limit", type=int, default=MAX_ACTIONS_PER_RUN)
            ap.add_argument("--scan-root", default=SCAN_ROOT)
            ap.add_argument("--strm-index", default=None,
                            help="JSON {strm_path: entry_name} — offline test mode; "
                                 "skips the filesystem scan")
            args = ap.parse_args()
            execute = args.execute

            log(f"mode={'EXECUTE' if execute else 'DRY-RUN'} limit={args.limit} "
                f"provider_down_pct={PROVIDER_DOWN_PCT} settle={ARR_SETTLE_HOURS}h")

            tok = decy_token()
            if not tok:
                log("FATAL: no Decypharr API token")
                return 2
            decy = Decypharr(tok)

            # ---- provider-down guard
            sweep_stats = {}
            try:
                runs = decy.repair_runs()
                if runs:
                    latest = sorted(runs, key=lambda r: r.get("started_at") or "")[-1]
                    stats = latest.get("stats", {})
                    sweep_stats = stats
                    probed, broken = stats.get("probed", 0), stats.get("broken", 0)
                    log(f"freshest sweep: status={latest.get('status')} probed={probed} "
                        f"broken={broken} healthy={stats.get('healthy', 0)}")
                    if probed >= 20 and broken / max(probed, 1) * 100 >= PROVIDER_DOWN_PCT:
                        # usenet-only deployments: with no debrid providers configured, a
                        # mass failure cannot be a debrid outage - it's the expected class
                        # (e.g. the RD-removal wave where every legacy debrid entry dies).
                        ndebrids = 1
                        try:
                            st2, cfgd = http_json(f"{DECY_API}/api/config", headers={"Authorization": f"Bearer {tok}"})
                            if st2 == 200 and isinstance(cfgd, dict):
                                ndebrids = len(cfgd.get("debrids") or [])
                        except Exception:  # noqa: BLE001
                            pass
                        if ndebrids == 0:
                            log(f"guard bypassed: {broken}/{probed} broken but no debrid providers "
                                f"configured (usenet-only) - mass failure is expected, proceeding")
                        else:
                            log(f"PROVIDER-DOWN GUARD: {broken}/{probed} ≥ {PROVIDER_DOWN_PCT}% broken "
                                f"— skipping (mass failure = outage, not per-release death)")
                            return 0
            except Exception as e:  # noqa: BLE001
                log(f"warn: sweep stats unavailable ({e}); continuing")

            # ---- detections: broken (probe) + bad-flagged (sticky flag dead zone)
            try:
                broken_entries = decy.health_all()
            except Exception as e:  # noqa: BLE001
                log(f"FATAL: cannot read health state: {e}")
                kuma_push("down", f"cannot read decypharr health state: {e}")
                return 2
            try:
                bad_entries = decy.bad_flag_entries()
            except Exception as e:  # noqa: BLE001
                log(f"warn: cannot read __bad__ folder ({e}); continuing")
                bad_entries = []
            detections = {h["entry_name"]: h for h in broken_entries}
            for b in bad_entries:
                detections.setdefault(b["entry_name"], b)  # probe-broken takes precedence
            log(f"detections: probe-broken={len(detections) - len(bad_entries)} "
                f"bad-flagged={len(bad_entries)} total={len(detections)}")

            # ---- strm index: entry_name -> [strm paths]
            if args.strm_index:
                raw = load_strm_index_file(args.strm_index)
                log(f"strm index loaded from file: {len(raw)} strms")
            else:
                raw = scan_strm_index(args.scan_root)
                log(f"strm scan: {len(raw)} strms under {args.scan_root}")
            entry_to_strms = _by_entry(raw)

            # ---- empirical sweep lane: Decypharr's health probe never flags the
            # legacy client_not_found class as broken, so this sweep is the detection
            # source for it. Skipped when Decypharr itself reports mass breakage
            # (>=20%) - that pattern is a provider outage, not per-release death.
            sw = {}
            if sweep_stats.get("probed") and \
                    sweep_stats.get("broken", 0) / max(sweep_stats["probed"], 1) >= 0.2:
                log("sweep lane skipped: decypharr reports >=20% broken (provider outage suspected)")
            else:
                sweep_entries, sw = sweep_dead_entries(raw)
                added = 0
                for e, h in sweep_entries.items():
                    if e not in detections:
                        detections[e] = h
                        added += 1
                log(f"sweep lane: probed={sw['probed']} alive={sw['alive']} "
                    f"dead_files={sw['dead_files']} dead_entries={added}")

            # ---- JF probe-failure lane (truncated/sick grabs the sweep can't see).
            jf = jf_probe_failures(raw)
            for e, h in jf.items():
                detections.setdefault(e, h)

            broken_entries = list(detections.values())
            if not broken_entries:
                log("nothing to repair")
                if sw.get("aborted"):
                    kuma_push("down", f"sweep aborted: {sw.get('offline', 0)} unreachable "
                                      f"- streaming backend outage suspected")
                    return 0
                kuma_push("up", f"clean: probed={sw.get('probed', 0)}")
                return 0

            # ---- arr indexes: strm path -> file record
            radarr = Arr(RADARR_API, RADARR_KEY, "radarr")
            sonarr = Arr(SONARR_API, SONARR_KEY, "sonarr")
            candidate_strms = [p for h in broken_entries
                               for p in entry_to_strms.get(h["entry_name"], [])]
            mfs = radarr.moviefiles()
            efs = sonarr.episodefiles_for(candidate_strms)
            path_index = {}
            for f in mfs:
                path_index[f["path"]] = ("movie", f)
            for f in efs:
                path_index[f["path"]] = ("episode", f)
            log(f"arr index: {len(mfs)} movie files, {len(efs)} episode files; "
                f"path joins={sum(1 for p in path_index if p in raw)}")

            ledger = load_ledger()
            now = datetime.now(timezone.utc)
            actions = 0
            planned = 0
            unmatched = []
            skipped_cooldown = 0
            skipped_settled = 0

            # per-arr search batches (one command per arr per run)
            movie_ids, episode_ids = set(), set()
            movie_hist, ep_hist = set(), set()
            movie_files, ep_files = set(), set()
            acted_entries = []

            sort_keys = {}
            for h in broken_entries:
                ss = entry_to_strms.get(h.get("entry_name", ""), [])
                sort_keys[h.get("entry_name", "")] = max(
                    (os.path.getmtime(s) for s in ss), default=0.0)

            for h in sorted(broken_entries,
                            key=lambda x: sort_keys.get(x.get("entry_name", ""), 0.0),
                            reverse=True):
                name = h.get("entry_name", "")
                if not name:
                    continue
                led = ledger.get(name, {})
                acted_at = led.get("acted_at")
                if acted_at:
                    acted = parse_dt(acted_at)
                    # (a) settle cooldown — replacement needs time to land
                    if acted and now - acted < timedelta(hours=ARR_SETTLE_HOURS):
                        skipped_cooldown += 1
                        continue
                    # (b) act again ONLY if the entry failed again after our action
                    # (replacement landed and later died). Prevents blocklist churn
                    # on titles whose every candidate is unrepairable (RD 451 class).
                    # Sweep-lane entries carry fresh empirical evidence from THIS run
                    # (re-probed every run), so the timestamp gate doesn't apply.
                    if h.get("src") == "sweep":
                        pass
                    else:
                        failed_again = parse_dt(h.get("last_failed_at"))
                        if failed_again is None or (acted and failed_again <= acted):
                            skipped_settled += 1
                            continue

                reason = h.get("failure_reason") or (
                    (h.get("broken_files") or [{}])[0].get("reason") if h.get("broken_files") else ""
                )

                strms = entry_to_strms.get(name, [])
                matched = [(p, path_index[p]) for p in strms if p in path_index]
                if not matched:
                    unmatched.append((name, reason, len(strms)))
                    ledger.setdefault(name, {})["last_seen"] = now.isoformat()
                    continue
                if actions >= args.limit:
                    continue

                # STREAMABILITY VERIFICATION (before any destructive action):
                # the health probe can disagree with reality (RD check passes,
                # unrestrict 451s), and the sticky Bad flag can outlive the real
                # failure. Only act on entries that EMPIRICALLY fail to stream.
                # Multi-file entries can be MIXED (some episodes alive, some dead —
                # e.g. a season folder where episodes 10-22 came from a dead
                # re-release): probing only strms[0] proves nothing about the rest
                # and permanently false-alarms the entry. Probe ALL files; the entry
                # counts as dead if ANY file fails.
                strms_sorted = sorted(strms)
                dead_file = None
                if h.get("src") == "jfprobe":
                    # Jellyfin's own deep ffprobe failed >= 2x in 48h. The shallow
                    # streamability probe CANNOT see this class (truncated grabs
                    # answer 2 KB range reads fine) - trust JF's evidence directly.
                    dead_file = file_from_strm(strms_sorted[0]) or strms_sorted[0]
                else:
                    for sp in strms_sorted:
                        fname = file_from_strm(sp)
                        if not decy.streamable(name, fname or None):
                            dead_file = fname or sp
                            break
                if dead_file is not None:
                    log(f"  VERIFIED-DEAD: {name[:70]} file={dead_file[-50:]} reason={reason}")
                else:
                    log(f"  FALSE-ALARM: {name[:70]} all {len(strms_sorted)} files stream — skipping")
                    ledger[name] = {**led, "last_seen": now.isoformat(), "status": "false_alarm"}
                    continue

                kinds = {k for _, (k, _) in matched}
                planned += 1
                actions += 1
                acted_entries.append(name)
                log(f"  MATCH: {name[:70]} reason={reason} strms={len(strms)} "
                    f"arr_files={len(matched)} kinds={sorted(kinds)}")

                for _p, (kind, f) in matched:
                    if kind == "movie":
                        movie_files.add(f.get("id"))
                        movie_ids.add(f.get("movieId"))
                    else:
                        ep_files.add(f.get("id"))
                        episode_ids.add(f.get("episodeId") or 0)
                    # gather history once per media id below

                # history lookups (dedup by media id)
                if "movie" in kinds:
                    mids = {f.get("movieId") for _, (k, f) in matched if k == "movie"}
                    for mid in mids:
                        for r in radarr.history_for_movie(mid):
                            if r.get("eventType") == "grabbed":
                                movie_hist.add(r.get("id"))
                if "episode" in kinds:
                    sids = {f.get("seriesId") for _, (k, f) in matched if k == "episode"}
                    for sid in sids:
                        for r in sonarr.history_for_series(sid):
                            if r.get("eventType") == "grabbed":
                                ep_hist.add(r.get("id"))

                if execute:
                    ledger[name] = {
                        "acted_at": now.isoformat(),
                        "kind": ",".join(sorted(kinds)),
                        "strm_count": len(strms),
                        "arr_files": len(matched),
                        "reason": reason,
                    }

            # ---- execute batched actions
            if execute and (movie_files or ep_files):
                log(f"EXECUTE: movieFiles={sorted(x for x in movie_files if x)} "
                    f"episodeFiles={sorted(x for x in ep_files if x)} "
                    f"blocklist(hist) movie={sorted(movie_hist)} ep={sorted(ep_hist)}")
                for fid in sorted(x for x in movie_files if x):
                    ok = radarr.delete_file("movie", fid)
                    log(f"  radarr DELETE moviefile/{fid} -> {ok}")
                for fid in sorted(x for x in ep_files if x):
                    ok = sonarr.delete_file("episode", fid)
                    log(f"  sonarr DELETE episodefile/{fid} -> {ok}")
                for hid in sorted(movie_hist):
                    ok = radarr.mark_failed(hid)
                    log(f"  radarr history/failed/{hid} -> {ok}")
                for hid in sorted(ep_hist):
                    ok = sonarr.mark_failed(hid)
                    log(f"  sonarr history/failed/{hid} -> {ok}")
                if movie_ids:
                    ok = radarr.search({"name": "MoviesSearch", "movieIds": sorted(x for x in movie_ids if x)})
                    log(f"  radarr MoviesSearch {sorted(movie_ids)} -> {ok}")
                if episode_ids:
                    ok = sonarr.search({"name": "EpisodeSearch", "episodeIds": sorted(x for x in episode_ids if x)})
                    log(f"  sonarr EpisodeSearch {sorted(episode_ids)[:20]}... -> {ok}")
                save_ledger(ledger)

            if unmatched:
                log(f"unmatched broken entries (no strm/arr linkage): {len(unmatched)}")
                for name, reason, n in unmatched[:15]:
                    log(f"    {name[:70]} (reason={reason}, strms={n})")

            log(f"done: entries_planned={planned} actions_used={actions}/{args.limit} "
                f"cooldown_skips={skipped_cooldown} settled_skips={skipped_settled} "
                f"({'EXECUTED' if execute else 'dry-run — nothing changed'})")

            # ---- monitoring: dead-man's switch + anomaly detection.
            # Kuma alerts when the beat goes missing (bridge died) or on a
            # deliberate down-push (bulk content death / stalled repairs).
            meta = ledger.setdefault("_meta", {})
            dead_now = sw.get("dead_entries", 0)
            prev_dead = meta.get("last_dead")
            repaired_now = len(movie_files) + len(ep_files)
            streak = meta.get("zero_streak", 0)
            if broken_entries and repaired_now == 0:
                streak += 1
            else:
                streak = 0
            reasons = []
            if sw and sw.get("probed", 0) == 0:
                reasons.append("sweep probed 0 files")
            if prev_dead is not None and dead_now - prev_dead >= 300:
                reasons.append(f"bulk death: {dead_now} dead (was {prev_dead})")
            if streak >= 2:
                reasons.append(f"repairs stalled: {streak} runs, {len(broken_entries)} candidates")
            if sw and sw.get("aborted"):
                reasons.append(f"sweep aborted: {sw.get('offline', 0)} unreachable (backend outage?)")
            kuma_push("down" if reasons else "up", "; ".join(reasons) or
                      f"probed={sw.get('probed', 0)} dead={dead_now} "
                      f"entries={len(broken_entries)} repaired={repaired_now}"
                      f"{', guard-skipped sweep' if not sw else ''}")
            meta["last_dead"] = dead_now
            meta["zero_streak"] = streak
            meta["last_run"] = now.isoformat()
            if execute:
                save_ledger(ledger)
            return 0


        if __name__ == "__main__":
            try:
                sys.exit(main())
            except SystemExit:
                raise
            except Exception as e:  # noqa: BLE001
                log(f"FATAL: unhandled: {e!r}")
                kuma_push("down", f"bridge crashed: {e!r}"[:250])
                sys.exit(3)

persistence:
  script:
    enabled: true
    type: configMap
    identifier: script
    globalMounts:
    - path: /scripts
  decy-state:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: decypharr-state-lh
    globalMounts:
    - path: /decy-state
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
  tmp:
    enabled: true
    type: emptyDir
    globalMounts:
    - path: /tmp
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
