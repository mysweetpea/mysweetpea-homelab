controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/containers/kubernetes-mcp-server
          tag: v0.1.3
        # v0.1.x removed every runtime CLI flag (only --config/--config-dir/--version
        # remain), so all options moved into TOML. The old --port/--stateless/
        # --read-only args crashlooped the pod from v0.0.67 -> v0.1.0.
        args:
        - --config
        - /etc/kubernetes-mcp-server/config.toml
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
    type: deployment
# The ClusterRoleBinding mcp-server-binding binds this SA.
# ClusterRole + Binding are committed in this app folder (rbac.yaml).
serviceAccount:
  create: true
  name: mcp-server-sa
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.238
    ports:
      http:
        port: 8080
# Runtime options for v0.1.x. read_only + stateless must come from TOML now.
configMaps:
  mcp-config:
    enabled: true
    data:
      config.toml: |
        port = "8080"
        bind_address = "0.0.0.0"
        stateless = true
        # Read-only enforcement (RBAC is also read-only — defense in depth)
        read_only = true
persistence:
  mcp-config:
    type: configMap
    identifier: mcp-config
    globalMounts:
    - path: /etc/kubernetes-mcp-server/config.toml
      subPath: config.toml
      readOnly: true
