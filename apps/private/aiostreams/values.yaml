controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/viren070/aiostreams
          tag: v2.35.9
          pullPolicy: IfNotPresent
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aiostreams-secrets
              key: SECRET_KEY
        - name: BASE_URL
          valueFrom:
            secretKeyRef:
              name: aiostreams-secrets
              key: BASE_URL
        - name: AIOSTREAMS_AUTH
          valueFrom:
            secretKeyRef:
              name: aiostreams-secrets
              key: AIOSTREAMS_AUTH
        - name: AIOSTREAMS_AUTH_PERMISSIONS
          valueFrom:
            secretKeyRef:
              name: aiostreams-secrets
              key: AIOSTREAMS_AUTH_PERMISSIONS
        # Stream/pipeline cache TTLs (24h) — env overrides DB config (web UI
        # doesn't expose these fields). Matches Gelato StreamTTL=86400 so
        # stream lists are served from cache instead of re-hitting addons.
        - name: STREAM_CACHE_TTL
          value: "86400"
        - name: PIPELINE_CACHE_TTL
          value: "86400"
        # Cache value size limit: default 2MB silently SKIPS larger stream
        # responses (recomputed every request) — raise to 10MB so popular
        # titles with many addon streams actually stay cached.
        - name: MAX_CACHE_VALUE_BYTES
          value: "10000000"
        # Precache next episode every 1h (default 24h) — binge sessions hit
        # warm cache (~0.017s) instead of cold resolution (~3.3s).
        - name: PRECACHE_NEXT_EPISODE_MIN_INTERVAL
          value: "3600"
        # Preload cooldown 5min (default 1h) — repeat plays/resumes warm.
        - name: PRELOAD_MIN_INTERVAL
          value: "300"
        # Catalog/meta cache TTL 1h (default 5min) — less upstream chatter,
        # faster daily Gelato import.
        - name: CATALOG_CACHE_TTL
          value: "3600"
        - name: META_CACHE_TTL
          value: "3600"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 45
              periodSeconds: 15
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    type: deployment
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    globalMounts:
    - path: /app/data
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.222
    ports:
      http:
        port: 3000
