apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-provisioner
  namespace: private
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terminal-provisioner
  namespace: private
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terminal-provisioner
  namespace: private
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terminal-provisioner
subjects:
  - kind: ServiceAccount
    name: terminal-provisioner
    namespace: private
---
# One policy for every member terminal: reachable only from Open WebUI,
# outbound only to the DNS and the web (pip, apt, docs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-terminal-members
  namespace: private
spec:
  podSelector:
    matchLabels:
      app: open-terminal
      role: member
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
