apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terminal-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: private
  source:
    repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    path: apps/private/terminal-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
