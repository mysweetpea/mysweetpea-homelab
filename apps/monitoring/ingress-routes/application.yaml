---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-ingress-routes
  namespace: argocd
  labels:
    app: monitoring-ingress-routes
spec:
  project: default
  source:
    repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    path: apps/monitoring/ingress-routes
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
