parent:
  dnsPolicy: ClusterFirst
  persistence:
    enabled: true
    storageclass: longhorn
    size: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  # Gotify token injected from the netdata-gotify sealed secret (NEVER inline it here —
  # this repo is public; the token was removed from git in the Aug 28 2026 audit).
  # netdata chart exposes env only via envFrom (parent.env is plain values, not refs).
  envFrom:
  - secretRef:
      name: netdata-gotify
  configs:
    telemetry-opt-out:
      enabled: true
      path: /etc/netdata/.opt-out-from-anonymous-statistics
      data: |
        # Anonymous usage statistics disabled (privacy: no phone-home).
    health:
      enabled: true
      path: /etc/netdata/health_alarm_notify.conf
      data: |
        SEND_EMAIL="NO"
        SEND_SLACK="NO"

        # Netdata has no generic webhook notifier, but the stock alarm-notify.sh defines
        # custom_sender() as a stub "to be overwritten by the config file". WARNING/CRITICAL go to
        # the autopilot; it investigates, fixes what it can, and only then pings Gotify.
        SEND_CUSTOM="YES"
        DEFAULT_RECIPIENT_CUSTOM="autopilot"
        SEND_GOTIFY="NO"

        _esc() { printf '%s' "$1" | tr '\n\r' '  ' | sed 's/\\/\\\\/g; s/"/\\"/g'; }

        custom_sender() {
          local body
          body=$(printf '{"source":"netdata","title":"%s on %s","message":"%s %s: %s","status":"%s"}' \
            "$(_esc "${name}")" "$(_esc "${host}")" "$(_esc "${status}")" \
            "$(_esc "${chart}")" "$(_esc "${info}")" "$(_esc "${status}")")
          curl -s -m 10 -X POST "http://holmes-dispatcher.monitoring.svc.cluster.local/alert" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' -d "${body}" >/dev/null 2>&1
        }
child:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
k8sState:
  persistence:
    enabled: true
    storageclass: longhorn
    volumesize: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 1m
      memory: 16Mi
service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.229
  port: 19999
image:
  tag: v2.12.3
  repository: netdata/netdata
