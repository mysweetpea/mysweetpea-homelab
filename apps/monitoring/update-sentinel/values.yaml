# update-sentinel — auto-rollback safety net for ArgoCD ImageUpdater bumps.
#
# The problem it closes: the image-updater chases "newest semver" with no health
# feedback. When upstream publishes a broken tag (nextcloud 35.0.0 = empty OCI
# index), a boot-wedging release (openclaw migrations), or anything else that
# fails AFTER the pod starts pulling, nothing notices until a human does — and
# the updater re-bumps any manual revert within minutes (proven Sep 16 2026).
#
# This CronJob closes the loop: reads ImageUpdater status.recentUpdates,
# health-verifies every bump (k8s workload gate + per-service HTTP/TCP gate with
# empirically-verified endpoints), and on failure past a grace window rolls the
# tag back in values.yaml via git (the updater's own write-back target) AND adds
# an ignoreTags entry (repo source + live CR patch to close the re-bump race),
# then Gotify-notifies with the full story.
#
# Safety: DRY_RUN burn-in default; per-alias cooldown; global 24h circuit
# breaker; ROLLBACK_EXCLUDE list; state cursor in a ConfigMap makes re-fires
# idempotent; single-flight CronJob.
controllers:
  sentinel:
    type: cronjob
    cronjob:
      schedule: "*/2 * * * *"       # updater reconciles every ~2min; 3min keeps up
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 120
      successfulJobsHistory: 3
      failedJobsHistory: 3
      backoffLimit: 1
      activeDeadlineSeconds: 3600   # hard cap: grace 420s + polls per alias, 1h worst case
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: python
          tag: "3.12-alpine"
          pullPolicy: IfNotPresent
        securityContext:
          # runs as root: apk needs root at boot to add git/openssh (stateless image).
          # Drops all caps; nothing escalated. HOME=/tmp keeps git identity out of /root.
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
        - /bin/sh
        - -c
        - |
          set -e
          apk add --no-cache git curl openssh-client >/dev/null
          KV=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KV}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          export HOME=/tmp
          pip install --quiet --user ruamel.yaml
          export PATH="$HOME/.local/bin:$PATH"
          cp /git-ssh/sshPrivateKey /tmp/id_ed25519 && chmod 600 /tmp/id_ed25519
          python3 /scripts/sentinel.py --once
        env:
        - name: DRY_RUN
          value: "0"                 # burn-in: flip to "0" after clean dry-run window
        - name: POD_NS
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GIT_REPO_URL
          value: "git@github.com:mysweetpea/mysweetpea-homelab.git"
        - name: GOTIFY_URL
          value: "http://gotify.private.svc.cluster.local"
        - name: GOTIFY_TOKEN
          valueFrom:
            secretKeyRef:
              name: update-sentinel-secrets
              key: GOTIFY_TOKEN
        - name: HEALTH_GRACE_S
          value: "420"
        - name: HEALTH_GRACE_S_PROBED
          value: "300"              # covers pull time in maxSurge=0 flow (probe-backed)
        - name: NOTIFY_QUIET_ALIASES
          value: "searxng,jellyfin,jellyseerr,seerr,aiostreams,zilean,flaresolverr,homepage,netdata,gotify,searxng-igotify,igotify-assist,authentik,nextcloud,immich,vaultwarden,vaultwarden-init,matrix,matrix-synapse,element-web,affine,affine-migrate,affine-patch,n8n,koalasync,decypharr,radarr,sonarr,prowlarr,bazarr,qbittorrent,grafana,loki,promtail,argocd,longhorn,traefik,ollama,open-webui,docling,mcp-server,open-terminal,openclaw,hindsight,nzbdav,rustdesk,rustdesk-hbbr,rustdesk-hbbs,cloudflared,uptime-kuma,headers"          # ✅ verified = ledger only for ALL aliases (Oct 3: phone = important-only); rollbacks/stuck still push
        - name: POLL_INTERVAL_S
          value: "30"
        - name: HEALTH_MAP_PATH
          value: "/config/health-map.json"
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
persistence:
  git-ssh:
    type: secret
    name: update-sentinel-git-ssh    # SealedSecret copy of argocd/ssh-git-creds
    globalMounts:
    - path: /git-ssh
      readOnly: true
  health-map:
    type: configMap
    identifier: health
    globalMounts:
    - path: /config
      readOnly: true
  scripts:
    type: configMap
    identifier: scripts
    globalMounts:
    - path: /scripts
      readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
    - path: /tmp
defaultPodOptions:
  # no runAsUser pin: container boots as root to apk-add git/openssh, then all real
  # work (git, sentinel) runs with HOME=/tmp and no privileged ops
  securityContext: {}

