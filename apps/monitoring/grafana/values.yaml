# Grafana — dashboards + log exploration (Loki datasource)
# LAN-only via MetalLB (user is the only accessor; Netbird VPN for remote).
# Admin login via sealed secret (no Authentik SSO needed).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
grafana.ini:
  server:
    root_url: http://192.168.20.226:3000
    serve_from_sub_path: false
  security:
    content_security_policy: true
  auth:
    disable_login_form: false
    disable_signout_menu: false
  auth.basic:
    enabled: true
  analytics:
    check_for_updates: false
  plugins:
    # Grafana 13.2.x runs a BACKGROUND PLUGIN INSTALLER at boot that tries to UPDATE every
    # "installed" plugin from the catalog into the pod. For plugins bundled in the image
    # (/usr/share/grafana/data/plugins-bundled — loki, prometheus, influxdb, tempo, ...) the
    # update step unlinks the SOURCE directory, which fails on the chart's readOnlyRootFilesystem
    # ("unlinkat .../plugins-bundled/loki: read-only file system") and the plugin is then
    # DE-REGISTERED. Net effect: the Loki datasource dies and every Loki-backed alert rule wedges
    # in health=error ([plugin.notRegistered] plugin not registered), firing Gotify spam.
    # Upstream chart 13.2.5 added exactly this key to fix it. Bundled plugins already match the
    # image version, so freezing their auto-update costs nothing and keeps them registering.
    preinstall_auto_update: "false"
  users:
    allow_sign_up: false
    auto_assign_org_role: Admin
    disable_gravatar: true
  log:
    mode: console
    level: info
  smtp:
    enabled: true
    host: smtp.resend.com:587
    user: resend
    # password comes from grafana-smtp sealed secret via GF_SMTP_PASSWORD env
    email_address: grafana@mysweetpea.cc
    from_name: MySweetPea Grafana
    startTLS_policy: OpportunisticStartTLS
    skip_verify: false
  # NOTE: Grafana OSS has NO [branding] ini section (Enterprise-only) - branding is done by
  # overwriting stock public assets via the 'branding' initContainer (extraInitContainers below).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: true
      jsonData:
        maxLines: 1000
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
    # Everything Grafana fires goes to the autopilot first; it investigates, fixes what it can,
    # and only pushes to Gotify when it needs a human. The dispatcher drops resolve messages.
    - orgId: 1
      name: holmes
      receivers:
      - uid: holmes-webhook
        type: webhook
        settings:
          url: "http://holmes-dispatcher.monitoring.svc.cluster.local/alert"
          httpMethod: POST
        disableResolveMessage: false
    # Kept for rollback / manual routing: point the policy back at this receiver.
    - orgId: 1
      name: gotify
      receivers:
      - uid: gotify-webhook
        type: webhook
        settings:
          url: "http://gotify.private.svc.cluster.local:80/message?token=$__env{GOTIFY_TOKEN}"
          httpMethod: POST
          title: "{{ `{{ template \"default.title\" . }}` }}"
          body: "{{ `{{ template \"default.message\" . }}` }}"
        disableResolveMessage: false
  policies.yaml:
    apiVersion: 1
    policies:
    - orgId: 1
      receiver: holmes
      group_by: ["grafana_folder", "alertname"]
  rules.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: cluster-log-errors
      folder: MySweetPea
      interval: 60s
      rules:
      - uid: error-log-spike
        title: "High ERROR log volume (5m)"
        condition: B
        data:
        - refId: A
          datasourceUid: P8E80F9AEF21F6940
          model:
            expr: |
              sum(count_over_time({job=~".+"} | detected_level="error" [5m]))
            refId: A
            datasource:
              type: loki
              uid: P8E80F9AEF21F6940
            intervalMs: 1000
            maxDataPoints: 43200
            queryType: "instant"
            supportMixedQueries: false
          relativeTimeRange:
            from: 300
            to: 0
          queryType: ""
        - refId: B
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 750
                type: gt
              operator:
                type: and
              query:
                params:
                - B
              reducer:
                type: last
              type: query
            datasource:
              type: __expr__
              uid: "__expr__"
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
            type: threshold
          relativeTimeRange:
            from: 0
            to: 0
        noDataState: NoData
        for: 5m
        annotations:
          summary: "High ERROR logs detected in cluster"
        labels:
          severity: warning
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    folderAnnotation: grafana_folder
    provider:
      allowUiUpdates: true
smtp:
  existingSecret: grafana-smtp
  userKey: smtp-user
  passwordKey: smtp-password
envValueFrom:
  GOTIFY_TOKEN:
    secretKeyRef:
      name: grafana-alerting
      key: GOTIFY_TOKEN
persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi
# ── MySweetPea branding (OSS approach) ──
# Grafana OSS ignores the Enterprise-only [branding] ini section. The login card + navbar logo come
# from stock files in /usr/share/grafana/public/img/ — the web root. ConfigMap subPath mounts shadow
# the stock files in place (kubelet does the mount; no root initContainer needed; siblings untouched).
# NOTE: subPath mounts need the target file's directory to exist in the image — it does (stock files).
extraVolumes:
- name: grafana-branding
  configMap:
    name: grafana-branding
extraVolumeMounts:
- name: grafana-branding
  mountPath: /usr/share/grafana/public/img/grafana_icon.svg
  subPath: mysweetpea-logo.svg
  readOnly: true
- name: grafana-branding
  mountPath: /usr/share/grafana/public/img/grafana_text_logo_dark.svg
  subPath: mysweetpea-logo.svg
  readOnly: true
- name: grafana-branding
  mountPath: /usr/share/grafana/public/img/grafana_text_logo_light.svg
  subPath: mysweetpea-logo.svg
  readOnly: true
# Favicons (contrast-boosted flower renders). NOTE: only the build/img/ copies are mounted —
# the login <link> references build/img/fav32.png (relative), and nested subPath mounts into
# public/img/ (where grafana_icon.svg already mounts) fail at container-create with
# 'not a directory' (nested bind-mount ordering).
- name: grafana-branding
  mountPath: /usr/share/grafana/public/build/img/fav32.png
  subPath: fav32.png
  readOnly: true
- name: grafana-branding
  mountPath: /usr/share/grafana/public/build/img/apple-touch-icon.png
  subPath: apple-touch-icon.png
  readOnly: true
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.226
  port: 3000
image:
  tag: 13.2.1
  repository: grafana/grafana
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
readinessProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
