# Loki — log aggregation (single binary, small footprint)
# NOTE: deploymentMode/singleBinary/backend/read/write/persistence/resources/
# service/gateway/test/monitoring/lokiCanary are TOP-LEVEL chart values.
loki:
  image:
    repository: grafana/loki
    tag: "3.5.12"
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-08-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_retain_period: 1m
    lifecycler:
      ring:
        kvstore:
          store: inmemory
  limits_config:
    retention_period: 14d
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 4
  pattern_ingester:
    enabled: true

deploymentMode: SingleBinary
# Loki's memcached chunks cache defaulted to 8 GiB (-m 8192, request 9830Mi) on
# a 15 GiB master VM — it grew until the node ran out of memory and swap, took
# kubelet down (Nov 11 06:40 outage) and only a reboot recovered it. 1 GiB is
# ample for a homelab query cache across 14 days of logs.
chunksCache:
  allocatedMemory: 1024
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 1280Mi
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi
# Rules sidecar (loki-sc-rules) resource limits
sidecar:
  resources:
    limits:
      cpu: 50m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
# Zero out the SimpleScalable targets (chart defaults them to 3 even in
# SingleBinary mode, which trips the "no object storage" validation)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

service:
  type: ClusterIP
  port: 3100

gateway:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

lokiCanary:
  enabled: false
