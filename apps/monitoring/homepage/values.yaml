controllers:
  main:
    initContainers:
      config-copy:
        image:
          repository: alpine
          tag: latest
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          cp /templates/* /app/config/
          for f in /app/config/*.yaml; do
            sed -i \
              -e "s|\${JELLYFIN_API_KEY}|${JELLYFIN_API_KEY}|g" \
              -e "s|\${SEERR_API_KEY}|${SEERR_API_KEY}|g" \
              -e "s|\${RADARR_API_KEY}|${RADARR_API_KEY}|g" \
              -e "s|\${SONARR_API_KEY}|${SONARR_API_KEY}|g" \
              -e "s|\${BAZARR_API_KEY}|${BAZARR_API_KEY}|g" \
              -e "s|\${PROWLARR_API_KEY}|${PROWLARR_API_KEY}|g" \
              -e "s|\${QBITTORRENT_USER}|${QBITTORRENT_USER}|g" \
              -e "s|\${QBITTORRENT_PASS}|${QBITTORRENT_PASS}|g" \
              -e "s|\${NEXTCLOUD_ADMIN_PASS}|${NEXTCLOUD_ADMIN_PASS}|g" \
              -e "s|\${IMMICH_API_KEY}|${IMMICH_API_KEY}|g" \
              -e "s|\${N8N_API_KEY}|${N8N_API_KEY}|g" \
              -e "s|\${GOTIFY_CLIENT_TOKEN}|${GOTIFY_CLIENT_TOKEN}|g" \
              -e "s|\${AUTHENTIK_API_TOKEN}|${AUTHENTIK_API_TOKEN}|g" \
              -e "s|\${ARGOCD_API_TOKEN}|${ARGOCD_API_TOKEN}|g" \
              -e "s|\${UPTIME_KUMA_SLUG}|${UPTIME_KUMA_SLUG}|g" \
              -e "s|\${TRAEFIK_USERNAME}|${TRAEFIK_USERNAME}|g" \
              -e "s|\${TRAEFIK_PASSWORD}|${TRAEFIK_PASSWORD}|g" \
              -e "s|\${LONGHORN_USERNAME}|${LONGHORN_USERNAME}|g" \
              -e "s|\${LONGHORN_PASSWORD}|${LONGHORN_PASSWORD}|g" \
              "$f"
          done
        envFrom:
        - secretRef:
            name: homepage-secrets
    containers:
      main:
        env:
          HOMEPAGE_ALLOWED_HOSTS: "192.168.20.213:3000,homepage.mysweetpea.cc"
        envFrom:
        - secretRef:
            name: homepage-secrets
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.5.0
        # Homepage v2.x ships a BUILD-TIME prerendered /en page (skeleton demo
        # content, ISR never revalidates on its own). After every pod recreate
        # the stale prerender would serve until /api/revalidate is hit. This
        # hook flushes it automatically once the server is listening.
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - |
                i=0
                until wget -q -O /dev/null --header "Host: 192.168.20.213:3000" "http://localhost:3000/api/revalidate" 2>/dev/null; do
                  i=$((i+1)); [ "$i" -ge 30 ] && break
                  sleep 2
                done
                echo "homepage: postStart revalidate done (attempts=$i)"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        probes:
          readiness:
            custom: true
            type: HTTP
            spec:
              httpGet:
                path: /
                port: 3000
                httpHeaders:
                - name: Host
                  value: homepage.mysweetpea.cc
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            enabled: true
    type: deployment
# Pinned to worker-b: master VM disk is failing (Aug 19 SSD incident) — keep
# the dashboard off the thrashing master
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  templates:
    enabled: true
    type: configMap
    name: homepage-templates
    globalMounts:
    - path: /templates
  config:
    enabled: true
    type: emptyDir
    globalMounts:
    - path: /app/config
  logo:
    enabled: true
    type: configMap
    name: sweetpea-logo
    advancedMounts:
      main:
        main:
        - path: /app/public/logo.svg
          subPath: logo.svg
  logs:
    enabled: true
    type: emptyDir
    globalMounts:
    - path: /app/config/logs
service:
  main:
    controller: main
    ports:
      http:
        port: 3000
    type: LoadBalancer
    loadBalancerIP: 192.168.20.213
    allocateLoadBalancerNodePorts: false
