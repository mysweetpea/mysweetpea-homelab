  settings.yaml: |
    title: SweetPea Homelab
    description: Your private command center
    headerStyle: boxedWidgets
    theme: dark
    color: slate
    iconStyle: theme
    target: _blank
    fullWidth: true
    disableCollapse: true
    useEqualHeights: true
    statusStyle: dot
    hideVersion: true
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system:80
        username: ${LONGHORN_USERNAME}
        password: ${LONGHORN_PASSWORD}
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: false
      provider: custom
      searchUrl: http://192.168.20.230:8080/search?q={query}
    layout:
      Info Widgets:
        tab: 🏠 Home
        header: false
        style: row
        columns: 4
      Infrastructure:
        tab: 🏠 Home
        icon: mdi-server-outline
        style: row
        columns: 4
      Streaming:
        tab: 🎬 Media
        icon: mdi-movie-open-outline
        style: row
        columns: 5
      Download Stack:
        tab: 🎬 Media
        icon: mdi-download-multiple-outline
        style: row
        columns: 4
      AI & Assistants:
        tab: 🤖 AI
        icon: mdi-robot-outline
        style: row
        columns: 4
      AI Tooling:
        tab: 🤖 AI
        icon: mdi-tools
        style: row
        columns: 5
      Personal Cloud:
        tab: 🔒 Private
        icon: mdi-cloud-lock-outline
        style: row
        columns: 4
      Chat:
        tab: 🔒 Private
        icon: mdi-chat-outline
        style: row
        columns: 4
      Coming Soon:
        tab: 🚀 Coming Soon
        icon: mdi-rocket-launch-outline
        style: row
        columns: 4
  widgets.yaml: |
    - resources:
        backend: resources
        cpu: true
        memory: true
        expanded: true
        disk: /
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - openmeteo:
        label: SweetPea
        latitude: 40.7128
        longitude: -74.006
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h12
    - greeting:
        text: SweetPea
        text_size: xl
    - logo:
        icon: /logo.svg
    - search:
        provider: custom
        url: http://192.168.20.230:8080/search?q={query}
        target: _blank
        focus: false
