  custom.css: |
    :root {
      --gold: #d4af37;
      --gold-light: #f0c75e;
      --gold-dark: #b8941f;
    }

    /* ========== THEME: gold-accented slate (v2 uses --color-theme-* oklch vars) ========== */
    html.theme-slate, .theme-slate {
      --color-theme-300: oklch(87.9% 0.169 91.605) !important; /* hover accents */
      --color-theme-400: oklch(80% 0.15 85) !important;
      --color-theme-500: oklch(78% 0.16 85) !important;       /* primary accent -> gold */
      --color-theme-600: oklch(70% 0.15 80) !important;
      --color-theme-700: oklch(60% 0.13 75) !important;
      --color-theme-800: oklch(45% 0.10 70) !important;
      --color-theme-900: oklch(30% 0.05 60) !important;
      --color-logo-start: 0.78 0.16 85;
      --color-logo-stop: 0.6 0.13 75;
    }

    /* ========== AMBIENT BACKGROUND (glow + grain) ========== */
    html, body, #__next, #page_wrapper, #inner_wrapper {
      background-color: #0a0c0e !important;
      background-image: none !important;
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 15%, rgba(212, 175, 55, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 10% 90%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 90% 10%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
      animation: bg-shift 32s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes bg-shift {
      0%, 100% { transform: scale(1); opacity: 1; }
      33% { transform: scale(1.07); opacity: 0.93; }
      66% { transform: scale(1.03); opacity: 0.97; }
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.5s steps(10) infinite;
    }
    @keyframes grain {
      0%,100% { transform: translate(0,0); } 10% { transform: translate(-2%,-2%); }
      20% { transform: translate(2%,2%); } 30% { transform: translate(-1%,1%); }
      40% { transform: translate(1%,-1%); } 50% { transform: translate(-2%,2%); }
      60% { transform: translate(2%,-2%); } 70% { transform: translate(-1%,-1%); }
      80% { transform: translate(1%,1%); } 90% { transform: translate(-2%,-1%); }
    }
    #petal-canvas { position: fixed !important; inset: 0 !important; z-index: 1 !important; pointer-events: none !important; }
    .container { position: relative; z-index: 2; }

    /* ========== LOGO WIDGET (center of attention) ========== */
    .information-widget-logo {
      order: -1 !important;
      margin: 0 auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .information-widget-logo .resolved, .information-widget-logo img, .information-widget-logo svg {
      width: 72px !important;
      height: 72px !important;
      filter: drop-shadow(0 0 24px rgba(212, 175, 55, 0.5));
    }
    .information-widget-logo .fallback { display: none !important; }

    /* ========== GREETING ========== */
    /* v2 DOM: div.information-widget-greeting > span.text-theme-800 (the text).
       text-fill-color inherits, so the clip+transparent fill MUST live on the span,
       not the wrapper — otherwise the greeting is invisible. */
    .information-widget-greeting {
      order: -2 !important;
      font-weight: 700 !important;
    }
    .information-widget-greeting span {
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 45%, var(--gold-dark)) !important;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      color: var(--gold-light) !important; /* fallback when clip is unsupported */
    }

    /* ========== TABS (pill bar — v2 renders #tabs > ul > li > button) ========== */
    #tabs { display: flex !important; justify-content: center !important; padding: 4px 0 10px !important; }
    #tabs ul {
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 4px !important;
      padding: 5px !important;
      background: rgba(12, 14, 16, 0.78) !important;
      border: 1px solid rgba(212, 175, 55, 0.22) !important;
      border-radius: 999px !important;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45) !important;
      backdrop-filter: blur(16px) !important;
    }
    #tabs ul li { margin: 0 !important; flex: none !important; width: auto !important; }
    #tabs ul li button {
      border-radius: 999px !important;
      color: #9d998e !important;
      font-weight: 600 !important;
      transition: all 0.22s ease !important;
      white-space: nowrap !important;
      padding: 8px 18px !important;
      margin: 0 !important;
    }
    #tabs ul li button[aria-selected="true"] {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.12)) !important;
      color: var(--gold-light) !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.2), inset 0 0 0 1px rgba(212, 175, 55, 0.3) !important;
    }
    #tabs ul li button:hover:not([aria-selected="true"]) {
      color: var(--gold-light) !important;
      background: rgba(212, 175, 55, 0.09) !important;
    }

    /* ========== INFO WIDGETS (glass cards) ========== */
    #information-widgets { align-items: center !important; }
    .widget-container {
      background: rgba(16, 18, 21, 0.72) !important;
      border: 1px solid rgba(212, 175, 55, 0.22) !important;
      border-radius: 14px !important;
      backdrop-filter: blur(10px) !important;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3) !important;
    }
    .information-widget-search, .information-widget-form { background: rgba(16, 18, 21, 0.72) !important; }

    /* ========== SERVICE CARDS (v2: service-container / service-block) ========== */
    .service-container {
      background: rgba(16, 18, 21, 0.72) !important;
      border: 1px solid rgba(212, 175, 55, 0.22) !important;
      border-radius: 14px !important;
      backdrop-filter: blur(10px) !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25) !important;
      transition: all 0.25s ease !important;
    }
    .service-container:hover {
      transform: translateY(-4px) !important;
      border-color: rgba(212, 175, 55, 0.55) !important;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), 0 0 26px rgba(212, 175, 55, 0.14) !important;
      background: rgba(20, 22, 24, 0.85) !important;
    }
    .service-block {
      border-radius: 14px !important;
      transition: all 0.25s ease !important;
    }

    /* ========== GROUP HEADERS (v2: .service-group-name equivalents) ========== */
    h2, .service-group-name, [class*="group-name"] {
      color: var(--gold-dark) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.09em !important;
      font-size: 0.8rem !important;
    }

    /* ========== BOOKMARKS ========== */
    .bookmark-group-name { color: var(--gold-dark) !important; font-size: 0.95rem !important; font-weight: 700 !important; }
    .bookmark a {
      background: rgba(16, 18, 21, 0.72) !important;
      border: 1px solid rgba(212, 175, 55, 0.22) !important;
      border-radius: 12px !important;
      transition: all 0.25s ease !important;
    }
    .bookmark a:hover {
      border-color: rgba(212, 175, 55, 0.55) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
    }
    .bookmark-icon { background: rgba(212, 175, 55, 0.15) !important; color: var(--gold-light) !important; }

    /* ========== SCROLLBAR + SELECTION ========== */
    ::selection { background: rgba(212, 175, 55, 0.35) !important; color: #fff !important; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0a0c0e; }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.22); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.4); }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .information-widget-logo .resolved, .information-widget-logo img, .information-widget-logo svg { width: 52px !important; height: 52px !important; }
      #tabs ul li button { padding: 7px 12px !important; font-size: 0.8rem !important; }
    }

    /* ========== v2.2 POLISH PASS (Sep 8 2026) ========== */
    /* Status dots — gold-family instead of stock green/red clash */
    .status-dot, [class*="ping-dot"], [class*="status-dot"] {
      box-shadow: 0 0 8px currentColor;
    }
    .online .status-dot, [class*="online"] [class*="dot"] {
      background: #7dc98f !important;
      box-shadow: 0 0 8px rgba(125, 201, 143, 0.6);
    }
    .offline .status-dot, [class*="offline"] [class*="dot"], [class*="error"] [class*="dot"] {
      background: #e06c6c !important;
      box-shadow: 0 0 8px rgba(224, 108, 108, 0.6);
    }
    .pending .status-dot, [class*="pending"] [class*="dot"] {
      background: var(--gold) !important;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* Coming Soon — muted, dashed, aspirational (no pings, no pressure) */
    .emerald-4 [class*="service"], .group-coming-soon .service-container {
      border-style: dashed !important;
      border-color: rgba(212, 175, 55, 0.18) !important;
      background: rgba(16, 18, 21, 0.45) !important;
      box-shadow: none !important;
      opacity: 0.82;
      transition: all 0.3s ease !important;
    }
    .group-coming-soon .service-container:hover, .emerald-4 .service-container:hover {
      opacity: 1;
      border-color: rgba(212, 175, 55, 0.45) !important;
      transform: translateY(-2px) !important;
    }

    /* Group headers — small gold rule under each section title */
    h2, .service-group-name, [class*="group-name"] {
      position: relative;
      padding-bottom: 4px;
    }
    h2::after, .service-group-name::after, [class*="group-name"]::after {
      content: "";
      position: absolute; left: 0; bottom: 0;
      width: 34px; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    /* Widget fields — subtle gold labels */
    .widget-field, [class*="widget-field"] { color: #b9b4a8 !important; }
    .widgets:not(:empty) { margin-top: 2px; }

    /* Quick-launch search — center it under greeting */
    .information-widget-form { width: min(560px, 90vw) !important; }

    /* Focus states (keyboard nav) */
    .service-container:focus-within, .bookmark a:focus-visible {
      outline: 2px solid rgba(212, 175, 55, 0.55) !important;
      outline-offset: 2px;
    }

    /* Respect reduced motion: kill petals/grain animations */
    @media (prefers-reduced-motion: reduce) {
      body::after, body::before, #petal-canvas { animation: none !important; display: none !important; }
    }
  custom.js: |
    console.log("SWEETPEA CUSTOM JS: file loaded");

    (function() {
      "use strict";
      var initialized = false;
      function log(msg) { console.log("[SweetPea Homepage]", msg); }

      function setGreeting() {
        try {
          var now = new Date();
          var hour = now.getHours();
          var part = hour < 5 ? "Good night" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
          var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
          var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
          var text = part + ", SweetPea — " + days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();
          var el = document.querySelector(".information-widget-greeting span");
          if (el) el.textContent = text;
        } catch (e) { /* non-fatal */ }
      }

      function init() {
        if (initialized) return;
        initialized = true;
        log("Starting initialization");
        try {
          // Ambient falling petals (subtle)
          var canvas = document.createElement("canvas");
          canvas.id = "petal-canvas";
          document.body.prepend(canvas);
          var ctx = canvas.getContext("2d");
          function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
          resizeCanvas();
          window.addEventListener("resize", resizeCanvas);
          var petals = [];
          var count = Math.min(60, Math.max(30, Math.floor((canvas.width * canvas.height) / 50000)));
          for (var i = 0; i < count; i++) {
            petals.push({
              x: Math.random() * canvas.width, y: Math.random() * canvas.height,
              size: Math.random() * 7 + 4, speedY: Math.random() * 0.7 + 0.25,
              speedX: (Math.random() - 0.5) * 0.4, rotation: Math.random() * Math.PI * 2,
              rotationSpeed: (Math.random() - 0.5) * 0.02, opacity: Math.random() * 0.25 + 0.1,
              sway: Math.random() * 0.015 + 0.004, swayOffset: Math.random() * Math.PI * 2
            });
          }
          var frame = 0;
          function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frame++;
            for (var i = 0; i < petals.length; i++) {
              var p = petals[i];
              p.y += p.speedY;
              p.x += p.speedX + Math.sin(frame * p.sway + p.swayOffset) * 0.4;
              p.rotation += p.rotationSpeed;
              if (p.y > canvas.height + 30) { p.y = -30; p.x = Math.random() * canvas.width; }
              if (p.x < -30) p.x = canvas.width + 30;
              if (p.x > canvas.width + 30) p.x = -30;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.globalAlpha = p.opacity;
              var grad = ctx.createLinearGradient(-p.size, -p.size, p.size, p.size);
              grad.addColorStop(0, "#f0c75e");
              grad.addColorStop(0.5, "#d4af37");
              grad.addColorStop(1, "#b8941f");
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(0, -p.size);
              ctx.bezierCurveTo(p.size * 0.7, -p.size * 0.4, p.size * 0.7, p.size * 0.4, 0, p.size);
              ctx.bezierCurveTo(-p.size * 0.7, p.size * 0.4, -p.size * 0.7, -p.size * 0.4, 0, -p.size);
              ctx.fill();
              ctx.restore();
            }
            requestAnimationFrame(animatePetals);
          }
          animatePetals();
          log("Created " + count + " petals");

          // Greeting after render
          setTimeout(setGreeting, 300);
          setTimeout(setGreeting, 1500);
          setInterval(setGreeting, 60000);

          log("Initialization complete");
        } catch (err) {
          console.error("SWEETPEA CUSTOM JS ERROR:", err);
        }
      }

      if (document.readyState === "complete") init();
      else window.addEventListener("load", init);
    })();
