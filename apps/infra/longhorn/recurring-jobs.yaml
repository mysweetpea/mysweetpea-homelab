# Longhorn recurring jobs — applied manually (Longhorn is not ArgoCD-managed; apply with:
#   kubectl apply -f apps/infra/longhorn/recurring-jobs.yaml
# Volumes in the "default" group match automatically (Longhorn 1.11+ removed
# volume.spec.recurringJobSelector; group matching is automatic).
#
# daily-snapshot — 03:00 snapshot, retain 5 (pre-existing; kept here for reference,
#                  still applied from recurring-job-daily-snapshot.yaml).
# daily-backup   — 04:00, block-level backup of ALL volumes to the VPS NFS target
#                  (nfs://100.82.13.16:/export/longhorn-backups/cluster over NetBird),
#                  retain 3 (was 7 - the target ran permanently full).
# weekly-trim    — Sunday 05:00, filesystem-trim on all volumes: returns deleted-file
#                  blocks to Longhorn (fstrim-equivalent that also handles
#                  snapshot-referenced space). Without it, churn-heavy volumes
#                  (netdata dbengine, jellyfin transcodes) balloon vs real data.
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 4 * * *"
  task: backup
  groups:
    - default
  # 7 kept the target permanently full (147G/147G on 2026-11-11, nightly
  # backups silently failing). 3 daily + 2 weekly + 2 monthly elsewhere gives
  # a week of coverage with room to write.
  retain: 3
  concurrency: 2
  labels:
    app: mysweetpea
    type: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  cron: "0 5 * * 0"
  task: filesystem-trim
  groups:
    - default
  retain: 1
  labels:
    app: mysweetpea
    type: trim
---
# Local snapshots are restore points that cost replica space (measured Nov 2026:
# 8 per volume, one of them 15 G). Backups already live in the store, so keep a
# single local snapshot instead of five.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: snapshot
  groups:
    - default
  retain: 1
  concurrency: 2
  labels:
    app: mysweetpea
    type: snapshot