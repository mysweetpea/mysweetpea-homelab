            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/monitoring/homepage/values.yaml
          images:
            - alias: homepage
              imageName: ghcr.io/gethomepage/homepage
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  name: controllers.main.containers.main.image.repository
                  tag: controllers.main.containers.main.image.tag
        - namePattern: jellyfin
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/private/jellyfin/values.yaml
          images:
            - alias: jellyfin
              imageName: jellyfin/jellyfin
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+(\\.\\d+)?$"
              manifestTargets:
                helm:
                  name: controllers.main.containers.main.image.repository
                  tag: controllers.main.containers.main.image.tag
        - namePattern: authentik
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/authentik/values.yaml
          images:
            - alias: authentik
              imageName: ghcr.io/goauthentik/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  # ⚠️ chart renders images from global.image.tag (Chart
                  # AppVersion fallback), NOT authentik.image.tag — this was
                  # broken (updates were no-ops) until Aug 20 2026.
                  name: global.image.repository
                  tag: global.image.tag
        - namePattern: nextcloud
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/private/nextcloud/values.yaml
          images:
            - alias: nextcloud
              imageName: library/nextcloud
              commonUpdateSettings:
                ignoreTags:
                  - '35\.0\.1'
                updateStrategy: semver
                # HOLD AT 34.x — deliberate major-version gate (reviewed 2026-09-17).
                # 35.0.0 is a .0 release (published Sep 15) and 15 enabled Nextcloud apps still
                # declare max-version 34; two of them (drawio, previewgenerator) have no NC35
                # release at all. Upgrading now would disable 13 apps pending updates + leave
                # those 2 dark. Decision: wait for 35.0.1+ and app releases.
                # 2026-10-04: UNPINNED for NC35 upgrade (owner-approved). Pre-flight done:
                # 6 apps capped-at-34 disabled (spreed, deck, groupfolders, integration_openai,
                # workflow_script, assistant); all other store apps verified 35-compatible via
                # apps.nextcloud.com platform/35 catalog; DB dumped (nc35-pre-dump.dump);
                # Longhorn offsite backup 2026-10-03T04:03Z. Sentinel will verify the rollout.
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  name: image.repository
                  tag: image.tag
        - namePattern: vaultwarden
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/vaultwarden/values.yaml
          images:
            - alias: vaultwarden
              imageName: vaultwarden/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  # gissilabs chart renders image from top-level image.repository/tag
                  # (NOT controllers.* — that bjw-s shape was a silent no-op)
                  name: image.repository
                  tag: image.tag
            # patch-web-vault init container splices the login disclaimer into
            # the image's own index.html — its tag MUST match the main image or
            # the patched bundle hashes 404 after a bump (element-web class bug).
            - alias: vaultwarden-init
              imageName: vaultwarden/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  spec: initContainers[0].image
        - namePattern: open-webui
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
