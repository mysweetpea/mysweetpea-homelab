config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
  sshConfig:
    config: |
      Host github.com
        IdentityFile /app/ssh-keys/id_rsa
        UserKnownHostsFile /app/config/ssh/ssh_known_hosts
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# NOTE (audit Aug 28 2026): the controller gates readiness on its first cache warm-up
# (readyz 'warmup-check'). A slow registry call during warm-up stalls the gate; chart 1.2.x
# HARDCODES the readiness probe (failureThreshold 3, no values override supported), so a
# >1min warm-up causes a restart loop. Observed behavior: warm-up eventually completes
# (~10-12min) and the pod goes 1/1 Ready; reconcile loop itself always worked (13s, 0 errors).
# If restarts recur, options: chart-side fix (upstream issue candidate), or a kubectl patch
# post-sync (rejected: breaks GitOps purity).
# ImageUpdater CR — v1.2.1 controller is CR-driven.
# CRITICAL (Session 41, Aug 14 2026): each app needs BOTH
#   - images[].manifestTargets.helm.tag = <values.yaml tag path>  (where to write)
#   - writeBackConfig.gitConfig.writeBackTarget = helmvalues:<values.yaml path> (which file)
# CRITICAL #2 (Session 43, Aug 14 2026): the CRD DEFAULTS writeBackConfig.method
# to "argocd" (live-spec-only write-back) at BOTH levels. Per-app method
# OVERRIDES the top-level spec.writeBackConfig.method in mergeWBCSettings →
# WITHOUT an explicit per-app `method: git:secret:argocd/ssh-git-creds`, the
# controller only updates the live spec and NEVER commits to git (the
# "Committing N parameter update(s)" log followed by no commits in origin/main).
# The earlier "proven" state had manifestTargets but NO writeBackTarget → the
# controller wrote .argocd-source-*.yaml overrides, which ArgoCD IGNORES for
# multi-source apps (sources[] + $values) → commits landed in git but no
# rollouts ever happened (live images stayed old: gotify 2.6.1, n8n 2.33.6).
# The SSH key secret must be named `ssh-git-creds` (chart default mount
# /app/ssh-keys/id_rsa, subPath sshPrivateKey) — the old name
# `argocd-image-updater-git-ssh` was never mounted → silent fallback to
# live-spec updates (reverted by selfHeal).
extraObjects:
  - |
    apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: homelab-image-updater
      namespace: argocd
    spec:
      writeBackConfig:
        method: git:secret:argocd/ssh-git-creds
        gitConfig:
          repository: git@github.com:mysweetpea/mysweetpea-homelab.git
          branch: main
      applicationRefs:
        - namePattern: n8n
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/private/n8n/values.yaml
          images:
            - alias: n8n
              imageName: n8nio/n8n
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^2\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  name: controllers.main.containers.main.image.repository
                  tag: controllers.main.containers.main.image.tag
        - namePattern: immich
          writeBackConfig:
            method: git:secret:argocd/ssh-git-creds
            gitConfig:
              writeBackTarget: helmvalues:apps/private/immich/values.yaml
          images:
            - alias: immich
              imageName: ghcr.io/immich-app/immich-server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  name: controllers.main.containers.main.image.repository
                  tag: controllers.main.containers.main.image.tag
        - namePattern: homepage
