---
# k3s-native Traefik config override — applied by k3s (survives upgrades).
# Lives on master at /var/lib/rancher/k3s/server/manifests/traefik-config.yaml.
# Chart schema verified against bundled traefik-39.0.701+up39.0.7.tgz:
#   resources (top-level), logs.access.enabled, additionalArguments (top-level)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    logs:
      access:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # GHSA-rf44-j88r-hh8c: drop dot/underscore-aliased duplicate headers on both
    # public entrypoints (ForwardAuth identity-spoofing fix, opt-in).
    additionalArguments:
      - "--entryPoints.web.http.aliasHeadersStrategy=delete"
      - "--entryPoints.websecure.http.aliasHeadersStrategy=delete"
    # Trust X-Forwarded-For arriving from in-cluster pods (the cloudflared tunnel
    # pod is the hop that sends it). Without this, traefik treats its direct peer
    # (cloudflared pod 10.42.x) as the client and REWRITES XFF — authentik then
    # records 10.42.x pod IPs for every SSO session/audit entry instead of real
    # visitor IPs (dashboard Sessions defect, fixed Sep 11 2026). Authentik 2026.8
    # already trusts RFC1918 by default (verified /authentik/lib/default.yml
    # web.trusted_proxy_cidrs), so this traefik hop was the only clobber point.
    # LAN clients remain UNtrusted (XFF spoof-proof).
    ports:
      web:
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
      websecure:
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
    # PIN (post-crash 2026-09-26): chart default image 3.6.x does not know
    # --entryPoints.*.http.aliasHeadersStrategy (3.7+ only) -> pod CrashLoopBackOff
    # 'field not found, node: aliasHeadersStrategy' whenever k3s re-renders from the
    # bundled chart at boot. 3.7.12 verified running 18d before the crash; the pin
    # lived only in the live cluster (drift) until now. library/traefik = official
    # Docker Hub image (same artifact family k3s mirrors).
    image:
      registry: docker.io
      repository: library/traefik
      tag: "3.7.12"
