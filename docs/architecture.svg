<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="660" fill="#020617"/>
  <rect width="920" height="660" fill="url(#grid)"/>

  <!-- ============ ROW 1: Internet → Tunnel → Traefik ============ -->
  <rect x="20" y="20" width="150" height="56" rx="6" fill="#0f172a"/>
  <rect x="20" y="20" width="150" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="42" fill="#e2e8f0" font-size="12" text-anchor="middle">Internet</text>
  <text x="95" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">users / community</text>

  <line x1="170" y1="48" x2="210" y2="48" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="20" width="170" height="56" rx="6" fill="#0f172a"/>
  <rect x="215" y="20" width="170" height="56" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="42" fill="#e2e8f0" font-size="12" text-anchor="middle">Cloudflare Tunnel</text>
  <text x="300" y="58" fill="#fbbf24" font-size="9" text-anchor="middle">no inbound ports open</text>

  <line x1="385" y1="48" x2="425" y2="48" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="20" width="150" height="56" rx="6" fill="#0f172a"/>
  <rect x="430" y="20" width="150" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="505" y="42" fill="#e2e8f0" font-size="12" text-anchor="middle">Traefik Ingress</text>
  <text x="505" y="58" fill="#22d3ee" font-size="9" text-anchor="middle">routes by hostname</text>

  <!-- ============ ROW 2: Authentik SSO ============ -->
  <rect x="20" y="100" width="880" height="52" rx="6" fill="#0f172a"/>
  <rect x="20" y="100" width="880" height="52" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="460" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">Authentik SSO — OIDC / OAuth2 / LDAP / Proxy</text>
  <text x="460" y="138" fill="#fb7185" font-size="9" text-anchor="middle">single identity · invite-only registration · 14+ services</text>

  <!-- dashed lines from SSO down to DMZ -->
  <line x1="120" y1="152" x2="120" y2="196" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-rose)"/>
  <line x1="300" y1="152" x2="300" y2="196" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-rose)"/>

  <!-- ============ ROW 3: Zones ============ -->
  <!-- DMZ -->
  <rect x="20" y="200" width="280" height="150" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="220" fill="#22d3ee" font-size="12" text-anchor="middle">DMZ — public services</text>
  <text x="160" y="234" fill="#64748b" font-size="9" text-anchor="middle">17 NetworkPolicies · default-deny</text>
  <rect x="35" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="95" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Vaultwarden</text>
  <text x="95" y="270" fill="#64748b" font-size="8" text-anchor="middle">passwords</text>
  <rect x="165" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="225" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Matrix</text>
  <text x="225" y="270" fill="#64748b" font-size="8" text-anchor="middle">chat</text>
  <rect x="35" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="95" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">Ollama</text>
  <text x="95" y="312" fill="#64748b" font-size="8" text-anchor="middle">local LLM</text>
  <rect x="165" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="225" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">SearXNG</text>
  <text x="225" y="312" fill="#64748b" font-size="8" text-anchor="middle">search</text>
  <text x="160" y="340" fill="#64748b" font-size="9" text-anchor="middle">+ AFFiNE · Seerr · KoalaSync · Element</text>

  <!-- Private -->
  <rect x="320" y="200" width="280" height="150" rx="8" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="460" y="220" fill="#34d399" font-size="12" text-anchor="middle">Private — LAN / internal</text>
  <text x="460" y="234" fill="#64748b" font-size="9" text-anchor="middle">12 NetworkPolicies · default-deny</text>
  <rect x="335" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="395" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Jellyfin</text>
  <text x="395" y="270" fill="#64748b" font-size="8" text-anchor="middle">media + Moonfin</text>
  <rect x="465" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="525" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Nextcloud</text>
  <text x="525" y="270" fill="#64748b" font-size="8" text-anchor="middle">files</text>
  <rect x="335" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="395" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">Immich</text>
  <text x="395" y="312" fill="#64748b" font-size="8" text-anchor="middle">photos</text>
  <rect x="465" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="525" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">n8n</text>
  <text x="525" y="312" fill="#64748b" font-size="8" text-anchor="middle">automation</text>
  <text x="460" y="340" fill="#64748b" font-size="9" text-anchor="middle">+ arr stack · Gotify · Open WebUI</text>

  <!-- Monitoring -->
  <rect x="620" y="200" width="280" height="150" rx="8" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="760" y="220" fill="#a78bfa" font-size="12" text-anchor="middle">Monitoring</text>
  <text x="760" y="234" fill="#64748b" font-size="9" text-anchor="middle">observability</text>
  <rect x="635" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="695" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Grafana</text>
  <text x="695" y="270" fill="#64748b" font-size="8" text-anchor="middle">+ Loki</text>
  <rect x="765" y="244" width="120" height="34" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="825" y="258" fill="#e2e8f0" font-size="10" text-anchor="middle">Uptime Kuma</text>
  <text x="825" y="270" fill="#64748b" font-size="8" text-anchor="middle">status page</text>
  <rect x="635" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="695" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">Netdata</text>
  <text x="695" y="312" fill="#64748b" font-size="8" text-anchor="middle">metrics</text>
  <rect x="765" y="286" width="120" height="34" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="825" y="300" fill="#e2e8f0" font-size="10" text-anchor="middle">Homepage</text>
  <text x="825" y="312" fill="#64748b" font-size="8" text-anchor="middle">dashboard</text>

  <!-- arrows from traefik into zones -->
  <line x1="505" y1="76" x2="160" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="76" x2="460" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="76" x2="760" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 4: Infra ============ -->
  <rect x="20" y="370" width="880" height="52" rx="6" fill="#0f172a"/>
  <rect x="20" y="370" width="880" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="460" y="392" fill="#e2e8f0" font-size="12" text-anchor="middle">Infra — ArgoCD GitOps · MetalLB · cert-manager · NetworkPolicies · Image Updater</text>
  <text x="460" y="408" fill="#fbbf24" font-size="9" text-anchor="middle">everything declared as code · 48 applications · auto-updates committed to git</text>

  <line x1="460" y1="350" x2="460" y2="366" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 5: Nodes ============ -->
  <rect x="20" y="442" width="880" height="86" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="460" y="462" fill="#fbbf24" font-size="12" text-anchor="middle">3-node K3s cluster — Ubuntu 26.04 · v1.36.1</text>

  <rect x="60" y="474" width="200" height="40" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="160" y="492" fill="#e2e8f0" font-size="11" text-anchor="middle">k3s-master</text>
  <text x="160" y="506" fill="#64748b" font-size="8" text-anchor="middle">control plane</text>

  <rect x="360" y="474" width="200" height="40" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="460" y="492" fill="#e2e8f0" font-size="11" text-anchor="middle">worker-a</text>
  <text x="460" y="506" fill="#64748b" font-size="8" text-anchor="middle">workloads</text>

  <rect x="660" y="474" width="200" height="40" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="760" y="492" fill="#e2e8f0" font-size="11" text-anchor="middle">worker-b</text>
  <text x="760" y="506" fill="#64748b" font-size="8" text-anchor="middle">workloads</text>

  <text x="460" y="520" fill="#a78bfa" font-size="9" text-anchor="middle">Longhorn distributed storage — replicas spread across all 3 nodes (RWO + RWX)</text>

  <!-- ============ Legend ============ -->
  <rect x="20" y="548" width="880" height="92" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="570" fill="#e2e8f0" font-size="11">Legend</text>
  <rect x="40" y="580" width="14" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="62" y="592" fill="#94a3b8" font-size="10">Frontend / ingress</text>
  <rect x="200" y="580" width="14" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="222" y="592" fill="#94a3b8" font-size="10">Backend services</text>
  <rect x="380" y="580" width="14" height="14" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="402" y="592" fill="#94a3b8" font-size="10">Monitoring / storage</text>
  <rect x="590" y="580" width="14" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="612" y="592" fill="#94a3b8" font-size="10">Cloud / platform</text>
  <rect x="770" y="580" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="792" y="592" fill="#94a3b8" font-size="10">Security</text>
  <line x1="40" y1="616" x2="70" y2="616" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="80" y="620" fill="#94a3b8" font-size="10">SSO / auth flow</text>
  <line x1="200" y1="616" x2="230" y2="616" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="620" fill="#94a3b8" font-size="10">traffic flow</text>
  <text x="380" y="620" fill="#64748b" font-size="10">default-deny NetworkPolicies in every zone</text>
</svg>
